<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>דווח על תקלה | IT Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">מרכז תמיכה RCC</h1>
        <p class="text-gray-500 text-sm mb-6 text-center">נא למלא את פרטי התקלה ונחזור אליכם בהקדם.</p>
        
        <div class="space-y-4">
            <input type="text" id="cust-name" placeholder="שם הלקוח / חברה" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            <textarea id="cust-desc" rows="4" placeholder="תיאור התקלה..." class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            <button onclick="sendTicket()" id="sendBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition">שלח קריאת שירות</button>
        </div>
        <div id="successMsg" class="hidden mt-4 p-4 bg-green-100 text-green-700 rounded-xl text-center font-bold">הקריאה נשלחה בהצלחה! טכנאי יחזור אליך בקרוב.</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA",
            authDomain: "itservice-ef2cb.firebaseapp.com",
            projectId: "itservice-ef2cb",
            storageBucket: "itservice-ef2cb.firebasestorage.app",
            messagingSenderId: "585535831360",
            appId: "1:585535831360:web:8b84f53b6892a2fc490ea5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.sendTicket = async () => {
            const name = document.getElementById('cust-name').value;
            const desc = document.getElementById('cust-desc').value;
            if(!name || !desc) return alert("נא למלא את כל השדות");

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerText = "שולח...";

            try {
                await addDoc(collection(db, "incidents"), {
                    desc: `[לקוח: ${name}] - ${desc}`,
                    priority: "P3 - Normal", // קריאות מהאתר נכנסות כרגיל כברירת מחדל
                    status: "New",
                    timestamp: Date.now()
                });
                document.getElementById('successMsg').classList.remove('hidden');
                btn.classList.add('hidden');
            } catch (e) {
                alert("שגיאה בשליחה. נסה שוב מאוחר יותר.");
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>

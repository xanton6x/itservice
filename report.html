<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Reports & Export | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #f1f5f9; display: flex; }
        .sidebar { width: 260px; background-color: #0f172a; min-height: 100vh; flex-shrink: 0; }
        .card { background: white; border-radius: 16px; padding: 24px; shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; }
        .btn-export { background: #1e293b; color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; transition: 0.3s; }
        .btn-export:hover { background: #334155; transform: scale(1.05); }
    </style>
</head>
<body>
    <aside class="sidebar p-6 text-white">
        <div class="text-2xl font-black text-emerald-400 mb-10 italic">IT CONTROL</div>
        <nav class="space-y-2">
            <a href="index.html" class="block p-3 rounded-lg hover:bg-slate-800"><i class="fas fa-home ml-2"></i> דאשבורד</a>
            <a href="incidents.html" class="block p-3 rounded-lg hover:bg-slate-800"><i class="fas fa-ticket-alt ml-2"></i> קריאות</a>
            <a href="reports.html" class="block p-3 rounded-lg bg-slate-800 border-r-4 border-emerald-500 font-bold"><i class="fas fa-chart-bar ml-2"></i> דוחות</a>
        </nav>
    </aside>

    <main class="flex-1 p-10">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-black text-slate-800">ניתוח נתונים מתקדם</h1>
                <p class="text-slate-500 italic">המייל של המנהל למשלוח דוחות: <span class="font-bold text-slate-700">anton@rcc.co.il</span></p>
            </div>
            <button onclick="exportToExcel()" class="btn-export shadow-lg shadow-slate-400/20">
                <i class="fas fa-file-excel ml-2 text-emerald-400"></i> ייצא נתונים לאקסל
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="card">
                <h3 class="font-bold text-slate-700 mb-6 border-b pb-2">פילוח קריאות לפי סטטוס</h3>
                <canvas id="incidentsChart" style="max-height: 300px;"></canvas>
            </div>
            <div class="card">
                <h3 class="font-bold text-slate-700 mb-6 border-b pb-2">עומס עבודה לפי משתמש</h3>
                <canvas id="userChart" style="max-height: 300px;"></canvas>
            </div>
        </div>

        <table id="hiddenTable" class="hidden">
            <thead><tr><th>נושא</th><th>משתמש</th><th>סטטוס</th><th>עדיפות</th></tr></thead>
            <tbody id="export-body"></tbody>
        </table>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA", authDomain: "itservice-ef2cb.firebaseapp.com", projectId: "itservice-ef2cb", storageBucket: "itservice-ef2cb.firebasestorage.app", messagingSenderId: "585535831360", appId: "1:585535831360:web:8b84f53b6892a2fc490ea5" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // טעינת נתונים לגרפים ולייצוא
        onSnapshot(collection(db, "incidents"), snap => {
            const data = snap.docs.map(d => d.data());
            updateCharts(data);
            populateExportTable(data);
        });

        function updateCharts(data) {
            const counts = { open: 0, progress: 0, closed: 0 };
            data.forEach(d => {
                if(d.status === 'פתוח') counts.open++;
                else if(d.status === 'בטיפול') counts.progress++;
                else counts.closed++;
            });

            new Chart(document.getElementById('incidentsChart'), {
                type: 'pie',
                data: {
                    labels: ['פתוח', 'בטיפול', 'סגור'],
                    datasets: [{ data: [counts.open, counts.progress, counts.closed], backgroundColor: ['#ef4444', '#3b82f6', '#10b981'] }]
                }
            });
        }

        function populateExportTable(data) {
            const body = document.getElementById('export-body');
            body.innerHTML = data.map(d => `<tr><td>${d.title}</td><td>${d.user}</td><td>${d.status}</td><td>${d.priority}</td></tr>`).join('');
        }

        window.exportToExcel = () => {
            const wb = XLSX.utils.table_to_book(document.getElementById('hiddenTable'));
            XLSX.writeFile(wb, `IT_Control_Report_${new Date().toLocaleDateString()}.xlsx`);
        };
    </script>
</body>
</html>

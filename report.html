<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>דוחות מערכת</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-4xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-8 text-gray-800">סטטיסטיקה וסיכום פעילות</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="text-center font-bold mb-4">מצב קריאות שירות</h3>
                <canvas id="ticketsChart"></canvas>
            </div>
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="text-center font-bold mb-4">תוקף רישיונות</h3>
                <canvas id="licenseChart"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, injectNavbar } from './js/app.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();

        async function initCharts() {
            const tks = await getDocs(collection(db, "tickets"));
            const lcs = await getDocs(collection(db, "licenses"));

            // סטטיסטיקה פשוטה לדוגמה
            new Chart(document.getElementById('ticketsChart'), {
                type: 'doughnut',
                data: {
                    labels: ['קריאות במערכת'],
                    datasets: [{ data: [tks.size], backgroundColor: ['#3b82f6'] }]
                }
            });

            new Chart(document.getElementById('licenseChart'), {
                type: 'bar',
                data: {
                    labels: ['סה"כ רישיונות'],
                    datasets: [{ label: 'כמות', data: [lcs.size], backgroundColor: '#10b981' }]
                }
            });
        }
        initCharts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>דוחות וסטטיסטיקה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 p-8">
    <h1 class="text-2xl font-bold mb-8 text-gray-800">מרכז בקרה וסטטיסטיקה</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-4">התפלגות קריאות שירות</h2>
            <canvas id="ticketsChart"></canvas>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-4">מצב רישיונות ESET</h2>
            <canvas id="licenseChart"></canvas>
        </div>
    </div>

    <script type="module">
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA",
            authDomain: "itservice-ef2cb.firebaseapp.com",
            projectId: "itservice-ef2cb",
            storageBucket: "itservice-ef2cb.firebasestorage.app",
            messagingSenderId: "585535831360",
            appId: "1:585535831360:web:8b84f53b6892a2fc490ea5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadCharts() {
            const tickets = await getDocs(collection(db, "tickets"));
            const licenses = await getDocs(collection(db, "licenses"));

            // לוגיקה לעיבוד נתונים לגרפים כאן...
            new Chart(document.getElementById('ticketsChart'), {
                type: 'doughnut',
                data: {
                    labels: ['פתוח', 'סגור'],
                    datasets: [{ data: [5, 12], backgroundColor: ['#3b82f6', '#e5e7eb'] }]
                }
            });
        }
        loadCharts();
    </script>
</body>
</html>

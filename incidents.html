<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול קריאות - מערכת IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal-active { overflow: hidden; }
        .timeline-item { position: relative; border-right: 2px solid #e2e8f0; padding-right: 1.5rem; margin-bottom: 1rem; }
        .timeline-item::before { 
            content: ''; position: absolute; right: -6px; top: 5px; 
            width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; 
        }
        .priority-low { border-right-color: #10b981 !important; }
        .priority-medium { border-right-color: #f59e0b !important; }
        .priority-high { border-right-color: #ef4444 !important; }
        .priority-critical { border-right-color: #7f1d1d !important; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-6">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">ניהול קריאות שירות</h1>
            <div class="inline-flex rounded-md shadow-sm mt-4 md:mt-0">
                <button onclick="changeStatusTab('open')" id="btnOpen" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg">קריאות פתוחות</button>
                <button onclick="changeStatusTab('closed')" id="btnClosed" class="px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg hover:bg-gray-50">היסטוריית סגורות</button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 grid grid-cols-1 md:grid-cols-3 gap-4 border border-slate-200">
            <div class="relative">
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="חפש INC, לקוח או טלפון..." class="w-full p-2 pr-8 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <i class="fas fa-search absolute right-2 bottom-3 text-gray-400"></i>
            </div>
            <select id="techFilter" onchange="applyFilters()" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <option value="all">כל הטכנאים</option>
                <option value="unassigned">טרם שויך</option>
            </select>
            <select id="priorityFilter" onchange="applyFilters()" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <option value="all">כל רמות הדחיפות</option>
                <option value="קריטי">קריטי</option>
                <option value="גבוהה">גבוהה</option>
                <option value="בינונית">בינונית</option>
                <option value="נמוכה">נמוכה</option>
            </select>
        </div>

        <div id="ticketsContainer" class="space-y-4"></div>
    </div>

    <div id="ticketModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                <div>
                    <span id="modalIncNumber" class="text-blue-600 font-mono font-bold text-lg"></span>
                    <h2 id="modalTitle" class="text-xl font-bold text-slate-800"></h2>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <div class="flex flex-wrap gap-4 mb-6 p-4 bg-gray-50 rounded-lg border border-gray-100 items-center justify-between">
                    <div class="flex gap-4">
                        <div class="flex items-center gap-2 text-slate-700">
                            <i class="fas fa-user text-gray-400"></i>
                            <span id="modalClientName" class="font-bold"></span>
                        </div>
                        <div class="flex items-center gap-2 text-blue-600">
                            <i class="fas fa-phone-alt"></i>
                            <a id="modalClientPhone" href="#" class="hover:underline font-semibold"></a>
                        </div>
                    </div>
                    <div id="modalPriorityBadge" class="px-3 py-1 rounded-full text-[10px] font-bold uppercase"></div>
                </div>

                <div class="grid grid-cols-3 gap-3 mb-6 bg-blue-50 p-4 rounded-lg">
                    <div><label class="block text-[9px] font-bold text-blue-400 uppercase">סטטוס</label><select id="modalStatusSelect" class="w-full mt-1 border rounded p-1 text-sm bg-white"></select></div>
                    <div><label class="block text-[9px] font-bold text-blue-400 uppercase">טכנאי</label><select id="modalTechSelect" class="w-full mt-1 border rounded p-1 text-sm bg-white"></select></div>
                    <div><label class="block text-[9px] font-bold text-blue-400 uppercase">דחיפות</label><select id="modalPrioritySelect" class="w-full mt-1 border rounded p-1 text-sm bg-white"></select></div>
                </div>

                <div class="mb-6">
                    <h3 class="text-sm font-bold text-gray-400 uppercase mb-2">תיאור</h3>
                    <p id="modalDescription" class="text-slate-700 bg-white p-3 rounded-lg border border-slate-100 italic"></p>
                </div>

                <div class="mb-4 text-sm font-bold text-gray-400 uppercase">יומן טיפול</div>
                <div id="modalTimeline" class="mr-2"></div>
            </div>

            <div class="p-4 border-t bg-gray-50">
                <textarea id="newComment" placeholder="רשום הערת טיפול..." class="w-full p-2 border rounded-lg text-sm h-20 mb-2 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                <button id="btnFullUpdate" onclick="saveAllChanges()" class="bg-blue-600 text-white w-full py-3 rounded-lg font-bold hover:bg-blue-700 shadow-lg transition">עדכן וסגור חלון</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_PRIMARY } from './js/app.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, orderBy, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();
        window.activeTicketId = null;
        let currentStatusTab = 'open';
        let techsList = []; 
        let allTickets = [];

        const priorityMap = { 'קריטי': 'priority-critical', 'גבוהה': 'priority-high', 'בינונית': 'priority-medium', 'נמוכה': 'priority-low' };

        async function fetchTechs() {
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                techsList = [];
                usersSnap.forEach(uDoc => {
                    const uData = uDoc.data();
                    if (uData.role === 'tech' || uData.role === 'admin' || uData.email === ADMIN_PRIMARY) {
                        techsList.push({ email: uData.email, name: uData.name || uData.email });
                    }
                });
                updateFiltersUI();
            } catch(e) { console.error("Error fetching techs:", e); }
        }

        function updateFiltersUI() {
            const techFilter = document.getElementById('techFilter');
            if(!techFilter) return;
            techsList.forEach(tech => {
                const opt = document.createElement('option'); opt.value = tech.email; opt.textContent = tech.name;
                techFilter.appendChild(opt);
            });
        }

        window.changeStatusTab = (type) => { 
            currentStatusTab = type; 
            const btnOpen = document.getElementById('btnOpen');
            const btnClosed = document.getElementById('btnClosed');
            if(type === 'open') {
                btnOpen.className = "px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg";
                btnClosed.className = "px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg hover:bg-gray-50";
            } else {
                btnClosed.className = "px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-l-lg";
                btnOpen.className = "px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-r-lg hover:bg-gray-50";
            }
            loadTickets(); 
        };

        async function loadTickets() {
            if (!auth.currentUser) return;
            if (techsList.length === 0) await fetchTechs();
            const statusFilter = currentStatusTab === 'open' ? ["חדש", "בטיפול"] : ["הושלם", "מבוטל"];
            const q = query(collection(db, "tickets"), where("status", "in", statusFilter), orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                allTickets = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                applyFilters();
                // עדכון המודאל רק אם הוא פתוח ובאמת יש מזהה פעיל
                if(window.activeTicketId) updateModalUI();
            });
        }

        window.applyFilters = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const tech = document.getElementById('techFilter').value;
            const priority = document.getElementById('priorityFilter').value;
            const filtered = allTickets.filter(t => {
                const incNum = `INC-${t.ticketNumber || t.id.slice(-4)}`.toLowerCase();
                const phone = String(t.clientPhone || "");
                return (!search || (t.clientName && t.clientName.toLowerCase().includes(search)) || phone.includes(search) || incNum.includes(search)) &&
                       (tech === 'all' || t.assignedTo === tech) &&
                       (priority === 'all' || t.priority === priority);
            });
            renderTickets(filtered);
        };

        function renderTickets(tickets) {
            const container = document.getElementById('ticketsContainer');
            container.innerHTML = '';
            tickets.forEach(t => {
                const pClass = priorityMap[t.priority] || 'border-gray-300';
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border-r-4 ${pClass} hover:shadow-md transition cursor-pointer flex justify-between items-center group">
                        <div class="flex-1" onclick="openTicket('${t.id}')">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-slate-100 text-[10px] font-bold px-1.5 py-0.5 rounded border">INC-${t.ticketNumber || t.id.slice(-4)}</span>
                                <span class="text-xs font-bold text-gray-700">${t.clientName || 'לקוח לא ידוע'}</span>
                                <span class="text-[10px] text-blue-500 font-bold"><i class="fas fa-phone-alt ml-1"></i>${t.clientPhone || '---'}</span>
                            </div>
                            <h3 class="font-bold text-slate-800">${t.title}</h3>
                            <div class="text-[10px] mt-1 text-gray-400 uppercase">
                                <span class="font-bold text-blue-600">${t.status}</span> | <span>${t.assignedTo || 'ללא שיוך'}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="quickClose('${t.id}')" title="סגירה מהירה" class="bg-green-50 text-green-600 p-2 rounded-full hover:bg-green-600 hover:text-white transition opacity-0 group-hover:opacity-100">
                                <i class="fas fa-check"></i>
                            </button>
                        </div>
                    </div>`;
            });
        }

        window.quickClose = async (id) => {
            event.stopPropagation(); // מניעת פתיחת המודאל
            if(!confirm("סגירת קריאה כ'הושלם'?")) return;
            try {
                await updateDoc(doc(db, "tickets", id), { 
                    status: "הושלם",
                    comments: arrayUnion({ text: "נסגר בסגירה מהירה", userName: auth.currentUser.email, date: new Date().toISOString() })
                });
            } catch (e) { alert("שגיאה: " + e.message); }
        };

        window.openTicket = (id) => {
            window.activeTicketId = id;
            updateModalUI();
            document.getElementById('ticketModal').classList.remove('hidden');
            document.body.classList.add('modal-active');
        };

        window.updateModalUI = () => {
            if(!window.activeTicketId) return;
            const t = allTickets.find(ticket => ticket.id === window.activeTicketId);
            if(!t) return;
            
            document.getElementById('modalIncNumber').innerText = `INC-${t.ticketNumber || t.id.slice(-4)}`;
            document.getElementById('modalTitle').innerText = t.title;
            document.getElementById('modalClientName').innerText = t.clientName || '';
            const phoneEl = document.getElementById('modalClientPhone');
            phoneEl.innerText = t.clientPhone || 'לא הוזן';
            phoneEl.href = t.clientPhone ? `tel:${t.clientPhone}` : '#';
            document.getElementById('modalDescription').innerText = t.description;

            const badge = document.getElementById('modalPriorityBadge');
            badge.innerText = t.priority || 'נמוכה';
            badge.className = `px-3 py-1 rounded-full text-[10px] font-bold uppercase ${t.priority === 'קריטי' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600'}`;

            document.getElementById('modalStatusSelect').innerHTML = ['חדש', 'בטיפול', 'הושלם', 'מבוטל'].map(s => `<option value="${s}" ${t.status === s ? 'selected' : ''}>${s}</option>`).join('');
            document.getElementById('modalPrioritySelect').innerHTML = ['נמוכה', 'בינונית', 'גבוהה', 'קריטי'].map(p => `<option value="${p}" ${t.priority === p ? 'selected' : ''}>${p}</option>`).join('');
            document.getElementById('modalTechSelect').innerHTML = `<option value="">ללא שיוך</option>` + techsList.map(tech => `<option value="${tech.email}" ${t.assignedTo === tech.email ? 'selected' : ''}>${tech.name}</option>`).join('');

            const timeline = document.getElementById('modalTimeline');
            if (t.comments && t.comments.length > 0) {
                const sorted = [...t.comments].sort((a, b) => new Date(b.date) - new Date(a.date));
                timeline.innerHTML = sorted.map(c => `<div class="timeline-item"><div class="text-[10px] font-bold text-blue-600">${c.userName} • ${new Date(c.date).toLocaleString('he-IL')}</div><p class="text-xs text-slate-700">${c.text}</p></div>`).join('');
            } else { timeline.innerHTML = '<p class="text-xs text-gray-400 italic">אין עדכונים.</p>'; }
        };

        // התיקון הסופי למניעת קפיאה
        window.saveAllChanges = async () => {
            if (!window.activeTicketId) return;
            
            const btn = document.getElementById('btnFullUpdate');
            const commentInput = document.getElementById('newComment');
            const commentText = commentInput.value.trim();
            
            if (btn.disabled) return;

            btn.disabled = true; 
            btn.innerText = 'שומר...';

            try {
                const currentId = window.activeTicketId;
                const ticketRef = doc(db, "tickets", currentId);
                const updateData = {
                    status: document.getElementById('modalStatusSelect').value,
                    assignedTo: document.getElementById('modalTechSelect').value,
                    priority: document.getElementById('modalPrioritySelect').value
                };

                if (commentText) {
                    updateData.comments = arrayUnion({ 
                        text: commentText, 
                        userName: auth.currentUser.email, 
                        date: new Date().toISOString() 
                    });
                }

                await updateDoc(ticketRef, updateData);
                
                // התיקון הקריטי: מאפסים את המזהה וסוגרים מיד
                commentInput.value = '';
                closeModal();

            } catch (e) {
                console.error("Save Error:", e);
                alert("שגיאה בשמירה: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'עדכן וסגור חלון';
            }
        };

        window.closeModal = () => { 
            document.getElementById('ticketModal').classList.add('hidden'); 
            document.body.classList.remove('modal-active'); 
            window.activeTicketId = null; // מונע עדכוני UI כפולים
        };

        auth.onAuthStateChanged(user => { if(user) loadTickets(); });
    </script>
</body>
</html>

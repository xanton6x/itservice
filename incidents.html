<div class="card p-6 mb-8 flex flex-wrap items-end gap-4 bg-white border-2 border-emerald-500/20">
    <div class="flex-1 min-w-[200px]">
        <label class="block text-xs font-bold text-slate-400 mb-1">חיפוש חופשי</label>
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="חפש לפי נושא או שם..." class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl focus:bg-white focus:border-emerald-500 transition outline-none text-slate-800 font-bold">
    </div>
    <div class="flex-1 min-w-[150px]">
        <label class="block text-xs font-bold text-slate-400 mb-1">נושא חדש</label>
        <input type="text" id="inc-title" placeholder="מה הבעיה?" class="w-full bg-white border-2 border-slate-100 p-3 rounded-xl focus:border-emerald-500 transition outline-none font-bold">
    </div>
    <button onclick="addIncident()" class="bg-emerald-600 text-white px-8 py-3.5 rounded-xl font-black hover:bg-emerald-700 shadow-lg shadow-emerald-600/30 transition-all active:scale-95">פתח קריאה</button>
</div>

<script>
    function filterTable() {
        const input = document.getElementById("searchInput").value.toUpperCase();
        const rows = document.getElementById("incidents-table-body").getElementsByTagName("tr");
        for (let i = 0; i < rows.length; i++) {
            const text = rows[i].innerText.toUpperCase();
            rows[i].style.display = text.includes(input) ? "" : "none";
        }
    }
</script>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול קריאות והיסטוריה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-6">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">ניהול קריאות שירות</h1>
            
            <div class="inline-flex rounded-md shadow-sm mt-4 md:mt-0" role="group">
                <button onclick="filterTickets('open')" id="btnOpen" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg hover:bg-blue-700">קריאות פתוחות</button>
                <button onclick="filterTickets('closed')" id="btnClosed" class="px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg hover:bg-gray-50">היסטוריית סגורות</button>
            </div>
        </div>

        <div id="ticketsContainer" class="space-y-4">
            <div class="text-center p-10 text-gray-500 italic">טוען נתונים...</div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_PRIMARY } from './js/app.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();

        let currentFilter = 'open';

        // פונקציית סינון
        window.filterTickets = (type) => {
            currentFilter = type;
            document.getElementById('btnOpen').className = type === 'open' ? 'px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg' : 'px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-r-lg';
            document.getElementById('btnClosed').className = type === 'closed' ? 'px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-l-lg' : 'px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg';
            loadTickets();
        };

        async function loadTickets() {
            const user = auth.currentUser;
            if (!user) return;

            const userDoc = await getDoc(doc(db, "users", user.uid));
            const role = userDoc.data()?.role || 'user';
            const isAdmin = (user.email === ADMIN_PRIMARY || role === 'admin');
            const isTech = (role === 'tech');

            let q;
            const ticketsCol = collection(db, "tickets");
            const statusFilter = currentFilter === 'open' ? ["חדש", "בטיפול"] : ["הושלם", "מבוטל"];

            // בניית השאילתה לפי הרשאות
            if (isAdmin) {
                q = query(ticketsCol, where("status", "in", statusFilter), orderBy("createdAt", "desc"));
            } else if (isTech) {
                q = query(ticketsCol, where("status", "in", statusFilter), where("assignedTo", "==", user.email));
            } else {
                q = query(ticketsCol, where("status", "in", statusFilter), where("userId", "==", user.uid));
            }

            // מאזין בזמן אמת - כאן היה התיקון
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('ticketsContainer');
                container.innerHTML = '';

                if (snapshot.empty) {
                    container.innerHTML = '<div class="bg-white p-10 text-center rounded shadow text-gray-400">אין קריאות להצגה.</div>';
                    return;
                }

                snapshot.forEach(ticketDoc => {
                    const t = ticketDoc.data();
                    const id = ticketDoc.id;
                    const date = t.createdAt ? new Date(t.createdAt).toLocaleString('he-IL') : 'תאריך לא ידוע';

                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-lg shadow border-r-4 ${t.status === 'הושלם' ? 'border-green-500' : 'border-blue-500'} mb-4">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-xs text-gray-400 font-mono">#${id.slice(-5)}</span>
                                        <span class="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-500">${date}</span>
                                    </div>
                                    <h3 class="text-lg font-bold text-slate-800">${t.clientName || 'לקוח'} - ${t.title}</h3>
                                    <div class="grid grid-cols-2 gap-2 mt-1 text-sm text-slate-600">
                                        <span><i class="fas fa-phone-alt ml-1 text-xs"></i> ${t.phone || 'אין טלפון'}</span>
                                        <span><i class="fas fa-tools ml-1 text-xs"></i> ${t.issueType || 'כללי'}</span>
                                    </div>
                                    <p class="mt-3 text-gray-700 bg-slate-50 p-3 rounded-md border border-slate-100 italic">"${t.description}"</p>
                                    
                                    ${t.techNote ? `
                                        <div class="mt-4 p-3 bg-green-50 border border-green-100 rounded-md">
                                            <h4 class="text-xs font-bold text-green-700 mb-1">סיכום ביצוע (טכנאי):</h4>
                                            <p class="text-sm text-green-800">${t.techNote}</p>
                                        </div>
                                    ` : ''}
                                </div>

                                <div class="mr-6 flex flex-col items-end gap-3">
                                    <div class="flex flex-col">
                                        <label class="text-[10px] font-bold text-gray-400 mb-1 uppercase">סטטוס קריאה</label>
                                        <select onchange="updateStatus('${id}', this.value)" class="text-sm border rounded-lg p-2 bg-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                            <option value="חדש" ${t.status === 'חדש' ? 'selected' : ''}>חדש</option>
                                            <option value="בטיפול" ${t.status === 'בטיפול' ? 'selected' : ''}>בטיפול</option>
                                            <option value="הושלם" ${t.status === 'הושלם' ? 'selected' : ''}>הושלם</option>
                                            <option value="מבוטל" ${t.status === 'מבוטל' ? 'selected' : ''}>מבוטל</option>
                                        </select>
                                    </div>

                                    <button onclick="addTechNote('${id}', '${t.techNote || ''}')" class="text-xs text-blue-600 hover:underline flex items-center gap-1">
                                        <i class="fas fa-edit"></i> ${t.techNote ? 'ערוך סיכום' : 'הוסף סיכום ביצוע'}
                                    </button>
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        window.updateStatus = async (id, newStatus) => {
            try {
                await updateDoc(doc(db, "tickets", id), { status: newStatus });
            } catch (e) { console.error("Update failed:", e); }
        };

        window.addTechNote = async (id, currentNote) => {
            const note = prompt("הזן סיכום לביצוע הקריאה:", currentNote);
            if (note !== null) {
                try {
                    await updateDoc(doc(db, "tickets", id), { techNote: note });
                } catch (e) { alert("שגיאה בעדכון ההערה: " + e.message); }
            }
        };

        auth.onAuthStateChanged(user => { if(user) loadTickets(); });
    </script>
</body>
</html>

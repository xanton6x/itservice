<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול קריאות - מערכת IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal-active {
            overflow: hidden;
        }

        .timeline-item {
            position: relative;
            border-right: 2px solid #e2e8f0;
            padding-right: 1.5rem;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-6">

        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">ניהול קריאות שירות</h1>
            <div class="inline-flex rounded-md shadow-sm mt-4 md:mt-0">
                <button onclick="changeStatusTab('open')" id="btnOpen" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg">קריאות פתוחות</button>
                <button onclick="changeStatusTab('closed')" id="btnClosed" class="px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg">היסטוריית סגורות</button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 grid grid-cols-1 md:grid-cols-3 gap-4 border border-slate-200">
            <div class="relative">
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="חפש INC, לקוח או תוכן..." class="w-full p-2 pr-8 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <i class="fas fa-search absolute right-2 bottom-3 text-gray-400"></i>
            </div>
            <select id="techFilter" onchange="applyFilters()" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <option value="all">כל הטכנאים</option>
                <option value="unassigned">טרם שויך</option>
            </select>
            <select id="typeFilter" onchange="applyFilters()" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <option value="all">כל סוגי התקלות</option>
                <option value="חומרה">חומרה</option>
                <option value="תוכנה">תוכנה</option>
                <option value="רשת">רשת</option>
            </select>
        </div>

        <div id="ticketsContainer" class="space-y-4"></div>
    </div>

    <div id="ticketModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                <div>
                    <span id="modalIncNumber" class="text-blue-600 font-mono font-bold text-lg"></span>
                    <h2 id="modalTitle" class="text-xl font-bold text-slate-800"></h2>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>

            <div class="p-6 overflow-y-auto flex-1">
                <div class="grid grid-cols-2 gap-4 mb-6 bg-blue-50 p-4 rounded-lg">
                    <div>
                        <label class="block text-[10px] font-bold text-blue-400 uppercase">סטטוס נוכחי</label>
                        <select id="modalStatusSelect" onchange="updateStatus(activeTicketId, this.value)" class="w-full mt-1 border rounded p-1 text-sm bg-white"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-blue-400 uppercase">טכנאי מטפל</label>
                        <select id="modalTechSelect" onchange="assignTicket(activeTicketId, this.value)" class="w-full mt-1 border rounded p-1 text-sm bg-white"></select>
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="text-sm font-bold text-gray-400 uppercase mb-2">תיאור התקלה</h3>
                    <p id="modalDescription" class="text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-100"></p>
                </div>

                <div class="mb-4">
                    <h3 class="text-sm font-bold text-gray-400 uppercase mb-3">יומן טיפול</h3>
                    <div id="modalTimeline" class="space-y-4 mr-2"></div>
                </div>
            </div>

            <div class="p-4 border-t bg-gray-50">
                <div class="flex gap-2">
                    <input type="text" id="newComment" placeholder="כתוב עדכון חדש..." class="flex-1 p-2 border rounded-lg text-sm outline-none">
                    <button onclick="submitComment()" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-bold hover:bg-blue-700">עדכן</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_PRIMARY } from './js/app.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, orderBy, getDoc, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();

        let currentStatusTab = 'open';
        let techsList = [];
        let allTickets = [];
        let activeTicketId = null;

        async function fetchTechs() {
            const usersSnap = await getDocs(collection(db, "users"));
            const techFilter = document.getElementById('techFilter');
            techsList = [];
            usersSnap.forEach(uDoc => {
                const uData = uDoc.data();
                if (uData.role === 'tech' || uData.role === 'admin' || uData.email === ADMIN_PRIMARY) {
                    techsList.push({ email: uData.email, name: uData.name || uData.email });
                    const opt = document.createElement('option');
                    opt.value = uData.email;
                    opt.textContent = uData.name || uData.email;
                    techFilter.appendChild(opt);
                }
            });
        }

        window.changeStatusTab = (type) => {
            currentStatusTab = type;
            document.getElementById('btnOpen').className = type === 'open' ? 'px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg' : 'px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-r-lg';
            document.getElementById('btnClosed').className = type === 'closed' ? 'px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-l-lg' : 'px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg';
            loadTickets();
        };

        async function loadTickets() {
            if (!auth.currentUser) return;
            if (techsList.length === 0) await fetchTechs();

            const statusFilter = currentStatusTab === 'open' ? ["חדש", "בטיפול"] : ["הושלם", "מבוטל"];
            const q = query(collection(db, "tickets"), where("status", "in", statusFilter), orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                allTickets = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                applyFilters();
                if (activeTicketId) updateModalUI(); // עדכון המודאל אם הוא פתוח
            });
        }

        window.applyFilters = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const tech = document.getElementById('techFilter').value;
            const type = document.getElementById('typeFilter').value;

            const filtered = allTickets.filter(t => {
                const incNum = `INC-${t.ticketNumber || t.id.slice(-4)}`.toLowerCase();
                return (!search || t.clientName?.toLowerCase().includes(search) || t.title?.toLowerCase().includes(search) || incNum.includes(search)) &&
                    (tech === 'all' || (tech === 'unassigned' && !t.assignedTo) || t.assignedTo === tech) &&
                    (type === 'all' || t.issueType === type);
            });
            renderTickets(filtered);
        };

        function renderTickets(tickets) {
            const container = document.getElementById('ticketsContainer');
            container.innerHTML = '';

            tickets.forEach(t => {
                const incNum = `INC-${t.ticketNumber || t.id.slice(-4)}`;
                const techOptions = techsList.map(tech => `<option value="${tech.email}" ${t.assignedTo === tech.email ? 'selected' : ''}>${tech.name}</option>`).join('');

                container.innerHTML += `
                        <div onclick="openTicket('${t.id}')" class="bg-white p-4 rounded-lg shadow-sm border-r-4 ${t.status === 'הושלם' ? 'border-green-500' : 'border-blue-500'} hover:border-blue-300 transition cursor-pointer">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="flex-1">
                                    <div class="flex items-center gap-3 mb-1">
                                        <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-mono text-xs font-bold">${incNum}</span>
                                        <span class="text-xs text-gray-400">${t.clientName}</span>
                                    </div>
                                    <h3 class="font-bold text-slate-800">${t.title}</h3>
                                </div>

                                <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                                    <div class="flex flex-col">
                                        <label class="text-[9px] font-bold text-gray-400 uppercase mr-1">שיוך</label>
                                        <select onchange="assignTicket('${t.id}', this.value)" class="text-xs border rounded p-1.5 bg-slate-50 border-slate-200">
                                            <option value="">בחר טכנאי...</option>
                                            ${techOptions}
                                        </select>
                                    </div>
                                    <div class="flex flex-col">
                                        <label class="text-[9px] font-bold text-gray-400 uppercase mr-1">סטטוס</label>
                                        <select onchange="updateStatus('${t.id}', this.value)" class="text-xs border rounded p-1.5 bg-slate-50">
                                            <option value="חדש" ${t.status === 'חדש' ? 'selected' : ''}>חדש</option>
                                            <option value="בטיפול" ${t.status === 'בטיפול' ? 'selected' : ''}>בטיפול</option>
                                            <option value="הושלם" ${t.status === 'הושלם' ? 'selected' : ''}>הושלם</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>`;
            });
        }

        window.openTicket = (id) => {
            activeTicketId = id;
            updateModalUI();
            document.getElementById('ticketModal').classList.remove('hidden');
            document.body.classList.add('modal-active');
        };

        function updateModalUI() {
            const t = allTickets.find(ticket => ticket.id === activeTicketId);
            if (!t) return;

            document.getElementById('modalIncNumber').innerText = `INC-${t.ticketNumber || t.id.slice(-4)}`;
            document.getElementById('modalTitle').innerText = t.title;
            document.getElementById('modalDescription').innerText = t.description;

            // עדכון ה-Selects בתוך המודאל
            const statusSelect = document.getElementById('modalStatusSelect');
            statusSelect.innerHTML = `
                    <option value="חדש" ${t.status === 'חדש' ? 'selected' : ''}>חדש</option>
                    <option value="בטיפול" ${t.status === 'בטיפול' ? 'selected' : ''}>בטיפול</option>
                    <option value="הושלם" ${t.status === 'הושלם' ? 'selected' : ''}>הושלם</option>
                `;

            const techSelect = document.getElementById('modalTechSelect');
            techSelect.innerHTML = `<option value="">ללא שיוך</option>` + techsList.map(tech =>
                `<option value="${tech.email}" ${t.assignedTo === tech.email ? 'selected' : ''}>${tech.name}</option>`
            ).join('');

            const timeline = document.getElementById('modalTimeline');
            timeline.innerHTML = t.comments?.map(c => `
                    <div class="timeline-item mb-4">
                        <div class="text-xs font-bold text-blue-600">${c.userName} <span class="text-gray-400 font-normal mr-2">${new Date(c.date).toLocaleString('he-IL')}</span></div>
                        <p class="text-sm text-slate-700">${c.text}</p>
                    </div>`).join('') || '<p class="text-xs text-gray-400 italic">אין עדכונים.</p>';
        }

        window.closeModal = () => {
            document.getElementById('ticketModal').classList.add('hidden');
            document.body.classList.remove('modal-active');
            activeTicketId = null;
        };

        window.assignTicket = async (id, techEmail) => {
            await updateDoc(doc(db, "tickets", id), { assignedTo: techEmail, status: techEmail ? "בטיפול" : "חדש" });
        };

        window.updateStatus = async (id, newStatus) => {
            await updateDoc(doc(db, "tickets", id), { status: newStatus });
        };

        window.submitComment = async () => {
            const input = document.getElementById('newComment');
            if (!input.value.trim() || !activeTicketId) return;
            await updateDoc(doc(db, "tickets", activeTicketId), {
                comments: arrayUnion({ text: input.value, userName: auth.currentUser.email, date: new Date().toISOString() })
            });
            input.value = '';
        };

        auth.onAuthStateChanged(user => { if (user) loadTickets(); });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול קריאות - מערכת IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal-active { overflow: hidden; }
        .timeline-item { position: relative; border-right: 2px solid #e2e8f0; padding-right: 1.5rem; margin-bottom: 1rem; }
        .timeline-item::before { 
            content: ''; position: absolute; right: -6px; top: 5px; 
            width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; 
        }
        .priority-low { border-right: 4px solid #10b981; }
        .priority-medium { border-right: 4px solid #f59e0b; }
        .priority-high { border-right: 4px solid #ef4444; }
        .priority-critical { border-right: 4px solid #7f1d1d; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
            text-align: center; border-radius: 8px; padding: 16px; position: fixed;
            z-index: 100; left: 30px; bottom: 30px; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="bg-gray-100">

    <div id="toast">הפעולה בוצעה בהצלחה</div>

    <div class="max-w-6xl mx-auto p-6">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">ניהול קריאות שירות</h1>
            <div class="flex gap-2 mt-4 md:mt-0">
                <button onclick="openNewTicketModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-indigo-700 transition shadow-md">
                    <i class="fas fa-plus-circle ml-1"></i> קריאה חדשה
                </button>
                <button onclick="exportToExcel()" class="bg-green-600 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-green-700 transition">
                    <i class="fas fa-file-excel ml-1"></i> ייצוא
                </button>
                <div class="inline-flex rounded-md shadow-sm">
                    <button onclick="changeStatusTab('open')" id="btnOpen" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg">פתוחות</button>
                    <button onclick="changeStatusTab('closed')" id="btnClosed" class="px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg hover:bg-gray-50">סגורות</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-slate-200 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="חפש מספר, לקוח או טלפון..." class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <select id="techFilter" onchange="applyFilters()" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"><option value="all">כל הטכנאים</option></select>
                <select id="priorityFilter" onchange="applyFilters()" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">כל הדחיפויות</option>
                    <option value="קריטי">קריטי</option><option value="גבוהה">גבוהה</option><option value="בינונית">בינונית</option><option value="נמוכה">נמוכה</option>
                </select>
            </div>
        </div>

        <div id="ticketsContainer" class="space-y-4"></div>
    </div>

    <div id="newTicketModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-800">פתיחת קריאה חדשה</h2>
                <button onclick="closeNewTicketModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">שם לקוח / חברה</label>
                    <input type="text" id="newTicketClient" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">טלפון ליצירת קשר</label>
                    <input type="tel" id="newTicketPhone" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">נושא התקלה</label>
                    <input type="text" id="newTicketTitle" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">תיאור מפורט</label>
                    <textarea id="newTicketDesc" class="w-full p-2 border rounded-lg h-24 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">דחיפות</label>
                        <select id="newTicketPriority" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="נמוכה">נמוכה</option>
                            <option value="בינונית" selected>בינונית</option>
                            <option value="גבוהה">גבוהה</option>
                            <option value="קריטי">קריטי</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">שיוך לטכנאי (אופציונלי)</label>
                        <select id="newTicketAssign" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">ללא שיוך</option>
                        </select>
                    </div>
                </div>
                <button onclick="createNewTicket()" id="btnCreateTicket" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition shadow-lg mt-2">צור קריאה במערכת</button>
            </div>
        </div>
    </div>

    <div id="ticketModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                <div>
                    <span id="modalIncNumber" class="text-blue-600 font-mono font-bold text-lg"></span>
                    <h2 id="modalTitle" class="text-xl font-bold text-slate-800"></h2>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <div class="flex flex-wrap gap-4 mb-6 p-4 bg-gray-50 rounded-lg border items-center justify-between">
                    <div class="flex gap-4">
                        <span id="modalClientName" class="font-bold text-slate-700"></span>
                        <a id="modalClientPhone" href="#" class="text-blue-600 font-bold hover:underline"></a>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3 mb-6 bg-blue-50 p-4 rounded-lg">
                    <div><label class="block text-[10px] font-bold text-blue-400">סטטוס</label><select id="modalStatusSelect" class="w-full mt-1 border rounded p-1 text-sm"></select></div>
                    <div><label class="block text-[10px] font-bold text-blue-400">טכנאי</label><select id="modalTechSelect" class="w-full mt-1 border rounded p-1 text-sm"></select></div>
                    <div><label class="block text-[10px] font-bold text-blue-400">דחיפות</label><select id="modalPrioritySelect" class="w-full mt-1 border rounded p-1 text-sm"></select></div>
                </div>

                <div class="mb-6">
                    <h3 class="text-xs font-bold text-gray-400 uppercase mb-2">תיאור התקלה</h3>
                    <p id="modalDescription" class="text-slate-700 bg-white p-3 rounded-lg border border-slate-100 italic"></p>
                </div>

                <div class="mb-4 text-xs font-bold text-gray-400 uppercase">יומן טיפול</div>
                <div id="modalTimeline" class="mr-2"></div>
            </div>

            <div class="p-4 border-t bg-gray-50">
                <textarea id="newComment" placeholder="עדכן מה בוצע..." class="w-full p-2 border rounded-lg text-sm h-20 mb-2 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                <button id="btnFullUpdate" onclick="saveAllChanges()" class="bg-blue-600 text-white w-full py-3 rounded-lg font-bold hover:bg-blue-700 shadow-lg transition">עדכן וסגור חלון</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_PRIMARY } from './js/app.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, deleteDoc, orderBy, getDocs, arrayUnion, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();
        window.activeTicketId = null;
        let currentStatusTab = 'open';
        let techsList = []; 
        let allTickets = [];
        let filteredTickets = [];

        const priorityMap = { 'קריטי': 'priority-critical', 'גבוהה': 'priority-high', 'בינונית': 'priority-medium', 'נמוכה': 'priority-low' };

        // טעינת טכנאים ועדכון הרשימות
        async function fetchTechs() {
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                techsList = [];
                usersSnap.forEach(uDoc => {
                    const uData = uDoc.data();
                    if (uData.role === 'tech' || uData.role === 'admin' || uData.email === ADMIN_PRIMARY) {
                        techsList.push({ email: uData.email, name: uData.name || uData.email });
                    }
                });
                
                // עדכון פילטר טכנאים
                const techFilter = document.getElementById('techFilter');
                techFilter.innerHTML = '<option value="all">כל הטכנאים</option>';
                // עדכון בחירת טכנאי בקריאה חדשה
                const newTicketAssign = document.getElementById('newTicketAssign');
                newTicketAssign.innerHTML = '<option value="">ללא שיוך (חדש)</option>';

                techsList.forEach(t => {
                    const opt = `<option value="${t.email}">${t.name}</option>`;
                    techFilter.innerHTML += opt;
                    newTicketAssign.innerHTML += opt;
                });
            } catch (e) { console.error("Error techs:", e); }
        }

        // ניהול טאבים (פתוחות/סגורות)
        window.changeStatusTab = (type) => { 
            currentStatusTab = type;
            document.getElementById('btnOpen').className = type === 'open' ? "px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg" : "px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-r-lg hover:bg-gray-50";
            document.getElementById('btnClosed').className = type === 'closed' ? "px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-l-lg" : "px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg hover:bg-gray-50";
            loadTickets(); 
        };

        // טעינת קריאות
        async function loadTickets() {
            if (!auth.currentUser) return;
            if (techsList.length === 0) await fetchTechs();
            const statusFilter = currentStatusTab === 'open' ? ["חדש", "בטיפול"] : ["הושלם", "מבוטל"];
            const q = query(collection(db, "tickets"), where("status", "in", statusFilter), orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                allTickets = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                applyFilters();
                if(window.activeTicketId) updateModalUI();
            });
        }

        window.applyFilters = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const tech = document.getElementById('techFilter').value;
            const priority = document.getElementById('priorityFilter').value;

            filteredTickets = allTickets.filter(t => {
                const cleanInc = String(t.ticketNumber || t.id.replace(/\D/g, '').slice(-5));
                return (!search || t.clientName?.toLowerCase().includes(search) || String(t.clientPhone).includes(search) || cleanInc.includes(search)) &&
                       (tech === 'all' || t.assignedTo === tech) &&
                       (priority === 'all' || t.priority === priority);
            });
            renderTickets(filteredTickets);
        };

        function renderTickets(tickets) {
            const container = document.getElementById('ticketsContainer');
            container.innerHTML = '';
            const isManager = auth.currentUser?.email === ADMIN_PRIMARY;

            tickets.forEach(t => {
                const cleanInc = String(t.ticketNumber || t.id.replace(/\D/g, '').slice(-5));
                let techOpts = `<option value="">שייך טכנאי...</option>` + techsList.map(tech => `<option value="${tech.email}" ${t.assignedTo === tech.email ? 'selected' : ''}>${tech.name}</option>`).join('');

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm ${priorityMap[t.priority] || 'priority-low'} hover:shadow-md transition flex flex-col md:flex-row justify-between items-center gap-4 group">
                        <div class="flex-1 cursor-pointer w-full" onclick="openTicket('${t.id}')">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-slate-800 text-white text-[11px] font-mono px-2 py-0.5 rounded">${cleanInc}</span>
                                <span class="text-xs font-bold text-gray-700">${t.clientName || 'לקוח'}</span>
                                <span class="text-[10px] text-blue-500 font-bold"><i class="fas fa-phone-alt ml-1"></i>${t.clientPhone || ''}</span>
                            </div>
                            <h3 class="font-bold text-slate-800">${t.title}</h3>
                        </div>
                        <div class="flex items-center gap-3 w-full md:w-auto">
                            <select onchange="quickAssign('${t.id}', this.value)" class="text-[11px] border rounded p-1 bg-gray-50 outline-none w-full md:w-32">${techOpts}</select>
                            <button onclick="quickClose('${t.id}')" class="text-green-600 p-2 hover:bg-green-50 rounded-full"><i class="fas fa-check-circle"></i></button>
                            ${isManager ? `<button onclick="permanentDelete('${t.id}')" class="text-red-500 p-2 hover:bg-red-50 rounded-full"><i class="fas fa-trash-alt"></i></button>` : ''}
                        </div>
                    </div>`;
            });
        }

        // --- פונקציות פתיחת קריאה חדשה ---
        window.openNewTicketModal = () => {
            document.getElementById('newTicketModal').classList.remove('hidden');
            document.body.classList.add('modal-active');
        };

        window.closeNewTicketModal = () => {
            document.getElementById('newTicketModal').classList.add('hidden');
            document.body.classList.remove('modal-active');
            // ניקוי שדות
            ['newTicketClient', 'newTicketPhone', 'newTicketTitle', 'newTicketDesc'].forEach(id => document.getElementById(id).value = '');
        };

        window.createNewTicket = async () => {
            const btn = document.getElementById('btnCreateTicket');
            const client = document.getElementById('newTicketClient').value.trim();
            const title = document.getElementById('newTicketTitle').value.trim();
            const phone = document.getElementById('newTicketPhone').value.trim();
            const desc = document.getElementById('newTicketDesc').value.trim();
            const priority = document.getElementById('newTicketPriority').value;
            const assign = document.getElementById('newTicketAssign').value;

            if(!client || !title) return alert("חובה למלא שם לקוח ונושא");

            btn.disabled = true; btn.innerText = "שומר...";

            try {
                const newTicket = {
                    clientName: client,
                    clientPhone: phone,
                    title: title,
                    description: desc,
                    priority: priority,
                    assignedTo: assign,
                    status: assign ? "בטיפול" : "חדש",
                    createdAt: new Date().toISOString(),
                    comments: []
                };

                await addDoc(collection(db, "tickets"), newTicket);
                closeNewTicketModal();
                showToast("קריאה חדשה נפתחה בהצלחה!");
            } catch (e) {
                alert("שגיאה ביצירה: " + e.message);
            } finally {
                btn.disabled = false; btn.innerText = "צור קריאה במערכת";
            }
        };

        // --- פונקציות ניהול קריאה קיימת ---
        window.saveAllChanges = () => {
            if (!window.activeTicketId) return;
            const id = window.activeTicketId;
            const comment = document.getElementById('newComment').value.trim();
            
            const updateData = {
                status: document.getElementById('modalStatusSelect').value,
                assignedTo: document.getElementById('modalTechSelect').value,
                priority: document.getElementById('modalPrioritySelect').value
            };
            
            if (comment) {
                updateData.comments = arrayUnion({ 
                    text: comment, userName: auth.currentUser.email, date: new Date().toISOString() 
                });
            }

            closeModal();
            showToast("מעדכן...");

            updateDoc(doc(db, "tickets", id), updateData)
                .then(() => showToast("הקריאה עודכנה!"))
                .catch(e => alert("שגיאה: " + e.message));
        };

        window.quickAssign = async (id, tech) => { await updateDoc(doc(db, "tickets", id), { assignedTo: tech, status: tech ? "בטיפול" : "חדש" }); };
        window.quickClose = async (id) => { if(confirm("לסגור קריאה?")) { await updateDoc(doc(db, "tickets", id), { status: "הושלם" }); showToast("קריאה נסגרה"); } };
        window.permanentDelete = async (id) => { if(confirm("למחוק לצמיתות?")) await deleteDoc(doc(db, "tickets", id)); };

        window.openTicket = (id) => { 
            window.activeTicketId = id; 
            updateModalUI(); 
            document.getElementById('ticketModal').classList.remove('hidden'); 
            document.body.classList.add('modal-active'); 
        };
        
        window.closeModal = () => { 
            document.getElementById('ticketModal').classList.add('hidden'); 
            document.body.classList.remove('modal-active'); 
            window.activeTicketId = null; 
            document.getElementById('newComment').value = ''; 
        };

        function showToast(msg) {
            const x = document.getElementById("toast");
            x.innerText = msg;
            x.className = "show";
            setTimeout(() => { x.className = x.className.replace("show", ""); }, 3000);
        }

        auth.onAuthStateChanged(user => { if(user) loadTickets(); });
    </script>
</body>
</html>

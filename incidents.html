<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול קריאות</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <script type="module">
        import { auth, db, injectNavbar, ADMIN_EMAIL } from './js/app.js';
        import { collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        injectNavbar();

        const container = document.createElement('div');
        container.className = "max-w-5xl mx-auto p-4";
        container.innerHTML = `<h1 class="text-2xl font-bold mb-4">רשימת קריאות שירות</h1><div id="list" class="space-y-4"></div>`;
        document.body.appendChild(container);

        onAuthStateChanged(auth, (user) => {
            if (!user) return window.location.href = 'login.html';

            let q = query(collection(db, "tickets"), where("userId", "==", user.uid));
            if (user.email === ADMIN_EMAIL) {
                q = collection(db, "tickets"); // אנטון רואה הכל
            }

            onSnapshot(q, (snapshot) => {
                const listDiv = document.getElementById('list');
                listDiv.innerHTML = '';
                snapshot.forEach(ticketDoc => {
                    const t = ticketDoc.data();
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded shadow border-r-4 " + (t.status === 'חדש' ? 'border-blue-500' : 'border-green-500');
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-lg">${t.title}</h3>
                                <p class="text-gray-600">${t.description}</p>
                                <small class="text-gray-400">נפתח ע"י: ${t.userEmail} | בתאריך: ${t.createdAt.split('T')[0]}</small>
                            </div>
                            <div class="text-left text-sm font-bold text-blue-600">${t.status}</div>
                        </div>
                    `;
                    listDiv.appendChild(card);
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidents | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        .sidebar { width: 260px; min-width: 260px; transition: all 0.3s; }
        .active-tab { background-color: #34494a; color: white; border-right: 4px solid #22c55e; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; right: -260px; height: 100%; z-index: 50; }
            .sidebar.active { right: 0; }
        }
        /* עיצוב סטטוסים */
        .status-open { background-color: #fee2e2; color: #b91c1c; }
        .status-process { background-color: #fef3c7; color: #b45309; }
        .status-closed { background-color: #d1fae5; color: #047857; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 flex min-h-screen text-gray-800 dark:text-gray-100">

    <aside id="sidebar" class="sidebar bg-[#162122] flex flex-col text-[#a5b1b2] shadow-2xl overflow-y-auto flex-shrink-0">
        <div class="p-6 text-white font-bold text-xl border-b border-gray-700 flex items-center gap-2">
            <i class="fas fa-microchip text-emerald-400"></i> IT CONTROL
        </div>
        <nav class="flex-1 mt-4 space-y-1">
            <a href="index.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-chart-line w-5"></i> דאשבורד
            </a>
            <a href="incidents.html" class="active-tab w-full text-right py-4 px-6 flex items-center gap-4 transition">
                <i class="fas fa-ticket-alt w-5"></i> קריאות שירות
            </a>
            <a href="eset_licenses.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-shield-alt w-5"></i> רישיונות ESET
            </a>
            <a href="admin_users.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-users-cog w-5"></i> ניהול משתמשים
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <div id="user-display-email" class="mb-2 text-[10px] text-center truncate italic opacity-60"></div>
            <button onclick="logout()" class="w-full bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white transition py-2 rounded-xl font-bold flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> התנתק
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="md:hidden bg-slate-800 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-[60]">
            <span class="font-bold">INCIDENTS</span>
            <button onclick="document.getElementById('sidebar').classList.toggle('active')"><i class="fas fa-bars text-xl"></i></button>
        </header>

        <main class="p-4 md:p-10 space-y-6 overflow-y-auto">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <h1 class="text-3xl font-black">ניהול <span class="text-blue-500">קריאות שירות</span></h1>
                <div class="flex gap-2 w-full md:w-auto">
                    <input type="text" id="search-incidents" placeholder="חיפוש קריאה..." class="flex-1 bg-white dark:bg-slate-800 border dark:border-gray-700 p-2 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-gray-200 dark:border-gray-700">
                <h3 class="text-sm font-bold mb-4 opacity-70">פתיחת קריאה חדשה</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="inc-title" placeholder="נושא הקריאה" class="bg-gray-50 dark:bg-slate-700 p-3 rounded-xl outline-none border focus:border-blue-500 text-sm">
                    <input type="text" id="inc-user" placeholder="שם המשתמש" class="bg-gray-50 dark:bg-slate-700 p-3 rounded-xl outline-none border focus:border-blue-500 text-sm">
                    <select id="inc-priority" class="bg-gray-50 dark:bg-slate-700 p-3 rounded-xl outline-none border text-sm">
                        <option value="נמוכה">עדיפות נמוכה</option>
                        <option value="בינונית">עדיפות בינונית</option>
                        <option value="גבוהה">עדיפות גבוהה 🔥</option>
                    </select>
                    <button onclick="addIncident()" class="bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-600/20">שלח קריאה</button>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl overflow-hidden border border-gray-200 dark:border-gray-700">
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-gray-50 dark:bg-slate-700 text-gray-500 font-bold uppercase">
                            <tr>
                                <th class="p-4">נושא</th>
                                <th class="p-4">משתמש</th>
                                <th class="p-4">תאריך</th>
                                <th class="p-4 text-center">עדיפות</th>
                                <th class="p-4 text-center">סטטוס</th>
                                <th class="p-4">פעולות</th>
                            </tr>
                        </thead>
                        <tbody id="incidents-table-body" class="divide-y divide-gray-100 dark:divide-gray-700 italic">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA", authDomain: "itservice-ef2cb.firebaseapp.com", projectId: "itservice-ef2cb", storageBucket: "itservice-ef2cb.firebasestorage.app", messagingSenderId: "585535831360", appId: "1:585535831360:web:8b84f53b6892a2fc490ea5" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const incCol = collection(db, "incidents");

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
            else document.getElementById('user-display-email').innerText = user.email;
        });

        // טעינה בזמן אמת
        onSnapshot(query(incCol, orderBy("timestamp", "desc")), (snap) => {
            const tbody = document.getElementById('incidents-table-body');
            tbody.innerHTML = '';
            snap.forEach(d => {
                const item = d.data();
                const id = d.id;
                
                let priorityClass = item.priority === 'גבוהה' ? 'text-red-500 font-bold' : '';
                let statusClass = item.status === 'סגור' ? 'status-closed' : (item.status === 'בטיפול' ? 'status-process' : 'status-open');

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/50 transition">
                        <td class="p-4 font-bold">${item.title}</td>
                        <td class="p-4 opacity-70">${item.user}</td>
                        <td class="p-4 text-xs">${new Date(item.timestamp).toLocaleDateString('he-IL')}</td>
                        <td class="p-4 text-center ${priorityClass}">${item.priority}</td>
                        <td class="p-4 text-center">
                            <select onchange="updateStatus('${id}', this.value)" class="rounded-full px-3 py-1 text-[10px] font-bold outline-none cursor-pointer ${statusClass}">
                                <option value="פתוח" ${item.status==='פתוח'?'selected':''}>פתוח</option>
                                <option value="בטיפול" ${item.status==='בטיפול'?'selected':''}>בטיפול</option>
                                <option value="סגור" ${item.status==='סגור'?'selected':''}>סגור</option>
                            </select>
                        </td>
                        <td class="p-4 text-center">
                            <button onclick="deleteInc('${id}')" class="text-gray-300 hover:text-red-500 transition"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>
                `;
            });
        });

        window.addIncident = async () => {
            const title = document.getElementById('inc-title').value;
            const user = document.getElementById('inc-user').value;
            const priority = document.getElementById('inc-priority').value;
            if(!title || !user) return alert("מלא נושא ושם משתמש");

            await addDoc(incCol, { title, user, priority, status: "פתוח", timestamp: Date.now() });
            document.getElementById('inc-title').value = '';
            document.getElementById('inc-user').value = '';
        };

        window.updateStatus = async (id, status) => {
            await updateDoc(doc(db, "incidents", id), { status });
        };

        window.deleteInc = async (id) => {
            if(confirm("למחוק קריאה זו?")) await deleteDoc(doc(db, "incidents", id));
        };

        window.logout = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>

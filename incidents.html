<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול קריאות מתקדם</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-6">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">ניהול קריאות שירות</h1>
            
            <div class="inline-flex rounded-md shadow-sm mt-4 md:mt-0" role="group">
                <button onclick="changeStatusTab('open')" id="btnOpen" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg">קריאות פתוחות</button>
                <button onclick="changeStatusTab('closed')" id="btnClosed" class="px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg hover:bg-gray-50">היסטוריית סגורות</button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 grid grid-cols-1 md:grid-cols-3 gap-4 border border-slate-200">
            <div class="relative">
                <label class="block text-xs font-bold text-gray-500 mb-1">חיפוש חופשי</label>
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="חפש לקוח, נושא או תיאור..." 
                       class="w-full p-2 pr-8 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <i class="fas fa-search absolute right-2 bottom-3 text-gray-400"></i>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">סינון לפי טכנאי</label>
                <select id="techFilter" onchange="applyFilters()" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">כל הטכנאים</option>
                    <option value="unassigned">טרם שויך</option>
                    </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">סוג תקלה</label>
                <select id="typeFilter" onchange="applyFilters()" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">כל הסוגים</option>
                    <option value="חומרה">חומרה</option>
                    <option value="תוכנה">תוכנה</option>
                    <option value="רשת">רשת</option>
                    <option value="אחר">אחר</option>
                </select>
            </div>
        </div>

        <div id="ticketsContainer" class="space-y-4">
            <div class="text-center p-10 text-gray-500 italic">טוען נתונים...</div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_PRIMARY } from './js/app.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, orderBy, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();

        let currentStatusTab = 'open';
        let techsList = []; 
        let allTickets = []; // נשמור את כל הקריאות כאן כדי לסנן מקומית לביצועים מהירים

        async function fetchTechs() {
            const usersSnap = await getDocs(collection(db, "users"));
            const techSelect = document.getElementById('techFilter');
            techsList = [];
            
            usersSnap.forEach(uDoc => {
                const uData = uDoc.data();
                if (uData.role === 'tech' || uData.role === 'admin' || uData.email === ADMIN_PRIMARY) {
                    techsList.push({ email: uData.email, name: uData.name || uData.email });
                    const opt = document.createElement('option');
                    opt.value = uData.email;
                    opt.textContent = uData.name || uData.email;
                    techSelect.appendChild(opt);
                }
            });
        }

        window.changeStatusTab = (type) => {
            currentStatusTab = type;
            document.getElementById('btnOpen').className = type === 'open' ? 'px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg' : 'px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-r-lg';
            document.getElementById('btnClosed').className = type === 'closed' ? 'px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-l-lg' : 'px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg';
            loadTickets();
        };

        async function loadTickets() {
            const user = auth.currentUser;
            if (!user) return;

            const userDoc = await getDoc(doc(db, "users", user.uid));
            const role = userDoc.data()?.role || 'user';
            const isAdmin = (user.email === ADMIN_PRIMARY || role === 'admin');

            if (isAdmin && techsList.length === 0) await fetchTechs();

            const statusFilter = currentStatusTab === 'open' ? ["חדש", "בטיפול"] : ["הושלם", "מבוטל"];
            const q = query(collection(db, "tickets"), where("status", "in", statusFilter), orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                allTickets = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                applyFilters(); // הרצת הסינון על הנתונים החדשים
            });
        }

        window.applyFilters = () => {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const techValue = document.getElementById('techFilter').value;
            const typeValue = document.getElementById('typeFilter').value;
            
            const filtered = allTickets.filter(t => {
                const matchesSearch = !searchText || 
                    (t.clientName?.toLowerCase().includes(searchText)) || 
                    (t.title?.toLowerCase().includes(searchText)) || 
                    (t.description?.toLowerCase().includes(searchText));
                
                const matchesTech = techValue === 'all' || 
                    (techValue === 'unassigned' && !t.assignedTo) || 
                    (t.assignedTo === techValue);
                
                const matchesType = typeValue === 'all' || t.issueType === typeValue;

                return matchesSearch && matchesTech && matchesType;
            });

            renderTickets(filtered);
        };

        function renderTickets(tickets) {
            const container = document.getElementById('ticketsContainer');
            container.innerHTML = '';

            if (tickets.length === 0) {
                container.innerHTML = '<div class="bg-white p-10 text-center rounded shadow text-gray-400">לא נמצאו קריאות התואמות את הסינון.</div>';
                return;
            }

            tickets.forEach(t => {
                const date = t.createdAt ? new Date(t.createdAt).toLocaleString('he-IL') : '---';
                const isAdmin = true; // לצורך הדוגמה, המערכת מציגה למנהל

                let assignHtml = `
                    <select onchange="assignTicket('${t.id}', this.value)" class="text-sm border rounded p-1 bg-slate-50 mt-1">
                        <option value="">שייך לטכנאי...</option>
                        ${techsList.map(tech => `<option value="${tech.email}" ${t.assignedTo === tech.email ? 'selected' : ''}>${tech.name}</option>`).join('')}
                    </select>`;

                container.innerHTML += `
                    <div class="bg-white p-5 rounded-lg shadow border-r-4 ${t.status === 'הושלם' ? 'border-green-500' : 'border-blue-500'}">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="text-xs text-gray-400 mb-1">#${t.id.slice(-5)} | ${date}</div>
                                <h3 class="font-bold text-slate-800">${t.clientName} - ${t.title}</h3>
                                <p class="text-sm text-gray-600 mt-2 p-2 bg-gray-50 rounded">${t.description}</p>
                                <div class="mt-2 flex gap-3 text-xs font-bold text-blue-600">
                                    <span><i class="fas fa-tag ml-1"></i>${t.issueType}</span>
                                    ${t.assignedTo ? `<span><i class="fas fa-user-check ml-1"></i>${t.assignedTo}</span>` : '<span class="text-red-500"><i class="fas fa-user-slash ml-1"></i>טרם שויך</span>'}
                                </div>
                            </div>
                            <div class="mr-4 flex flex-col gap-2 min-w-[150px]">
                                <label class="text-[10px] font-bold text-gray-400 uppercase">סטטוס</label>
                                <select onchange="updateStatus('${t.id}', this.value)" class="text-sm border rounded p-1">
                                    <option value="חדש" ${t.status === 'חדש' ? 'selected' : ''}>חדש</option>
                                    <option value="בטיפול" ${t.status === 'בטיפול' ? 'selected' : ''}>בטיפול</option>
                                    <option value="הושלם" ${t.status === 'הושלם' ? 'selected' : ''}>הושלם</option>
                                </select>
                                <label class="text-[10px] font-bold text-gray-400 uppercase mt-2">שיוך</label>
                                ${assignHtml}
                            </div>
                        </div>
                    </div>`;
            });
        }

        window.assignTicket = async (id, techEmail) => {
            await updateDoc(doc(db, "tickets", id), { assignedTo: techEmail, status: techEmail ? "בטיפול" : "חדש" });
        };

        window.updateStatus = async (id, newStatus) => {
            await updateDoc(doc(db, "tickets", id), { status: newStatus });
        };

        auth.onAuthStateChanged(user => { if(user) loadTickets(); });
    </script>
</body>
</html>

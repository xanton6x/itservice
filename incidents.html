<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול קריאות - מערכת IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal-active { overflow: hidden; }
        .priority-low { border-right: 4px solid #10b981; }
        .priority-medium { border-right: 4px solid #f59e0b; }
        .priority-high { border-right: 4px solid #ef4444; }
        .priority-critical { border-right: 4px solid #7f1d1d; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    </style>
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-6">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">ניהול קריאות שירות</h1>
            <div class="inline-flex rounded-md shadow-sm mt-4 md:mt-0">
                <button onclick="changeStatusTab('open')" id="btnOpen" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-r-lg">קריאות פתוחות</button>
                <button onclick="changeStatusTab('closed')" id="btnClosed" class="px-4 py-2 text-sm font-medium bg-white text-gray-700 border border-gray-200 rounded-l-lg hover:bg-gray-50">היסטוריית סגורות</button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-slate-200 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="applyFilters()" placeholder="חפש מספר, לקוח או טלפון..." class="w-full p-2 pr-8 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <i class="fas fa-search absolute right-2 bottom-3 text-gray-400"></i>
                </div>
                <select id="techFilter" onchange="applyFilters()" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">כל הטכנאים</option>
                    <option value="unassigned">טרם שויך</option>
                </select>
                <select id="priorityFilter" onchange="applyFilters()" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">כל רמות הדחיפות</option>
                    <option value="קריטי">קריטי</option>
                    <option value="גבוהה">גבוהה</option>
                    <option value="בינונית">בינונית</option>
                    <option value="נמוכה">נמוכה</option>
                </select>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t border-gray-50">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-gray-500">מתאריך:</label>
                    <input type="date" id="dateFrom" onchange="applyFilters()" class="p-1 border rounded text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-gray-500">עד תאריך:</label>
                    <input type="date" id="dateTo" onchange="applyFilters()" class="p-1 border rounded text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
        </div>

        <div id="ticketsContainer" class="space-y-4"></div>
    </div>

    <div id="ticketModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                <div>
                    <span id="modalIncNumber" class="text-blue-600 font-mono font-bold text-lg"></span>
                    <h2 id="modalTitle" class="text-xl font-bold text-slate-800"></h2>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <div id="modalContent">
                    <div class="flex flex-wrap gap-4 mb-6 p-4 bg-gray-50 rounded-lg items-center justify-between">
                        <div class="flex gap-4">
                            <span id="modalClientName" class="font-bold"></span>
                            <a id="modalClientPhone" href="#" class="text-blue-600 font-semibold"></a>
                        </div>
                        <div id="modalPriorityBadge" class="px-3 py-1 rounded-full text-[10px] font-bold uppercase"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3 mb-6 bg-blue-50 p-4 rounded-lg">
                        <select id="modalStatusSelect" class="border rounded p-1 text-sm"></select>
                        <select id="modalTechSelect" class="border rounded p-1 text-sm"></select>
                        <select id="modalPrioritySelect" class="border rounded p-1 text-sm"></select>
                    </div>
                    <p id="modalDescription" class="text-slate-700 bg-white p-3 rounded border italic mb-4"></p>
                    <div id="modalTimeline" class="space-y-2"></div>
                </div>
            </div>
            <div class="p-4 border-t bg-gray-50">
                <textarea id="newComment" placeholder="רשום הערת טיפול..." class="w-full p-2 border rounded-lg text-sm h-20 mb-2 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                <button id="btnFullUpdate" onclick="saveAllChanges()" class="bg-blue-600 text-white w-full py-3 rounded-lg font-bold hover:bg-blue-700">עדכן וסגור</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_PRIMARY } from './js/app.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, deleteDoc, orderBy, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();
        window.activeTicketId = null;
        let currentStatusTab = 'open';
        let techsList = []; 
        let allTickets = [];

        const priorityMap = { 'קריטי': 'priority-critical', 'גבוהה': 'priority-high', 'בינונית': 'priority-medium', 'נמוכה': 'priority-low' };

        async function fetchTechs() {
            const usersSnap = await getDocs(collection(db, "users"));
            techsList = [];
            usersSnap.forEach(uDoc => {
                const uData = uDoc.data();
                if (uData.role === 'tech' || uData.role === 'admin' || uData.email === ADMIN_PRIMARY) {
                    techsList.push({ email: uData.email, name: uData.name || uData.email });
                }
            });
            updateFiltersUI();
        }

        function updateFiltersUI() {
            const techFilter = document.getElementById('techFilter');
            if(!techFilter) return;
            techsList.forEach(tech => {
                const opt = document.createElement('option'); opt.value = tech.email; opt.textContent = tech.name;
                techFilter.appendChild(opt);
            });
        }

        window.changeStatusTab = (type) => { currentStatusTab = type; loadTickets(); };

        async function loadTickets() {
            if (!auth.currentUser) return;
            if (techsList.length === 0) await fetchTechs();
            const statusFilter = currentStatusTab === 'open' ? ["חדש", "בטיפול"] : ["הושלם", "מבוטל"];
            const q = query(collection(db, "tickets"), where("status", "in", statusFilter), orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                allTickets = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                applyFilters();
                if(window.activeTicketId) updateModalUI();
            });
        }

        window.applyFilters = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const tech = document.getElementById('techFilter').value;
            const priority = document.getElementById('priorityFilter').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            const filtered = allTickets.filter(t => {
                // המרת INC למספרים בלבד לחיפוש ותצוגה
                const rawNum = String(t.ticketNumber || t.id.replace(/\D/g, '').slice(-5));
                const phone = String(t.clientPhone || "");
                const createdAt = t.createdAt ? t.createdAt.split('T')[0] : "";

                const matchesSearch = !search || t.clientName?.toLowerCase().includes(search) || phone.includes(search) || rawNum.includes(search);
                const matchesTech = tech === 'all' || t.assignedTo === tech;
                const matchesPriority = priority === 'all' || t.priority === priority;
                const matchesDate = (!dateFrom || createdAt >= dateFrom) && (!dateTo || createdAt <= dateTo);

                return matchesSearch && matchesTech && matchesPriority && matchesDate;
            });
            renderTickets(filtered);
        };

        function renderTickets(tickets) {
            const container = document.getElementById('ticketsContainer');
            container.innerHTML = '';
            const isManager = auth.currentUser?.email === ADMIN_PRIMARY;

            tickets.forEach(t => {
                const pClass = priorityMap[t.priority] || 'priority-low';
                const cleanInc = String(t.ticketNumber || t.id.replace(/\D/g, '').slice(-5));
                
                let techOptions = `<option value="">שיוך טכנאי...</option>`;
                techsList.forEach(tech => {
                    techOptions += `<option value="${tech.email}" ${t.assignedTo === tech.email ? 'selected' : ''}>${tech.name}</option>`;
                });

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm ${pClass} hover:shadow-md transition flex flex-col md:flex-row justify-between items-center gap-4 group">
                        <div class="flex-1 cursor-pointer" onclick="openTicket('${t.id}')">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-slate-800 text-white text-[11px] font-mono px-2 py-0.5 rounded">${cleanInc}</span>
                                <span class="text-xs font-bold text-gray-700">${t.clientName || 'לקוח'}</span>
                                <span class="text-[10px] text-blue-500 font-bold"><i class="fas fa-phone-alt ml-1"></i>${t.clientPhone || ''}</span>
                            </div>
                            <h3 class="font-bold text-slate-800">${t.title}</h3>
                        </div>
                        <div class="flex items-center gap-3 w-full md:w-auto">
                            <select onchange="quickAssign('${t.id}', this.value)" class="text-[11px] border rounded p-1 bg-gray-50 outline-none w-full md:w-32">
                                ${techOptions}
                            </select>
                            <button onclick="quickClose('${t.id}')" class="text-green-600 p-2 hover:bg-green-50 rounded-full"><i class="fas fa-check-circle"></i></button>
                            ${isManager ? `<button onclick="permanentDelete('${t.id}')" class="text-red-500 p-2 hover:bg-red-50 rounded-full"><i class="fas fa-trash-alt"></i></button>` : ''}
                        </div>
                    </div>`;
            });
        }

        window.quickAssign = async (id, techEmail) => {
            try {
                await updateDoc(doc(db, "tickets", id), { assignedTo: techEmail, status: techEmail ? "בטיפול" : "חדש" });
            } catch (e) { alert(e.message); }
        };

        window.permanentDelete = async (id) => {
            if (!confirm("מחיקה לצמיתות? לא ניתן לשחזר!")) return;
            try { await deleteDoc(doc(db, "tickets", id)); } catch (e) { alert(e.message); }
        };

        window.quickClose = async (id) => {
            if(!confirm("לסגור קריאה?")) return;
            try { await updateDoc(doc(db, "tickets", id), { status: "הושלם" }); } catch (e) { alert(e.message); }
        };

        window.openTicket = (id) => {
            window.activeTicketId = id;
            updateModalUI();
            document.getElementById('ticketModal').classList.remove('hidden');
            document.body.classList.add('modal-active');
        };

        window.updateModalUI = () => {
            if(!window.activeTicketId) return;
            const t = allTickets.find(ticket => ticket.id === window.activeTicketId);
            if(!t) return;
            const cleanInc = String(t.ticketNumber || t.id.replace(/\D/g, '').slice(-5));
            document.getElementById('modalIncNumber').innerText = cleanInc;
            document.getElementById('modalTitle').innerText = t.title;
            document.getElementById('modalClientName').innerText = t.clientName || '';
            document.getElementById('modalClientPhone').innerText = t.clientPhone || '';
            document.getElementById('modalDescription').innerText = t.description;
            document.getElementById('modalStatusSelect').innerHTML = ['חדש', 'בטיפול', 'הושלם'].map(s => `<option value="${s}" ${t.status === s ? 'selected' : ''}>${s}</option>`).join('');
            document.getElementById('modalPrioritySelect').innerHTML = ['נמוכה', 'בינונית', 'גבוהה', 'קריטי'].map(p => `<option value="${p}" ${t.priority === p ? 'selected' : ''}>${p}</option>`).join('');
            document.getElementById('modalTechSelect').innerHTML = `<option value="">שיוך...</option>` + techsList.map(tech => `<option value="${tech.email}" ${t.assignedTo === tech.email ? 'selected' : ''}>${tech.name}</option>`).join('');
        };

        window.saveAllChanges = async () => {
            if (!window.activeTicketId) return;
            const btn = document.getElementById('btnFullUpdate');
            const comment = document.getElementById('newComment').value.trim();
            btn.disabled = true; btn.innerText = 'שומר...';
            try {
                const updateData = {
                    status: document.getElementById('modalStatusSelect').value,
                    assignedTo: document.getElementById('modalTechSelect').value,
                    priority: document.getElementById('modalPrioritySelect').value
                };
                if (comment) updateData.comments = arrayUnion({ text: comment, userName: auth.currentUser.email, date: new Date().toISOString() });
                await updateDoc(doc(db, "tickets", window.activeTicketId), updateData);
                closeModal();
            } catch (e) { alert(e.message); } finally { btn.disabled = false; btn.innerText = 'עדכן וסגור'; }
        };

        window.closeModal = () => { 
            document.getElementById('ticketModal').classList.add('hidden'); 
            document.body.classList.remove('modal-active'); 
            window.activeTicketId = null;
            document.getElementById('newComment').value = '';
        };

        auth.onAuthStateChanged(user => { if(user) loadTickets(); });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול קריאות מתקדם</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6">לוח בקרה - קריאות שירות</h1>
        
        <div class="bg-white shadow-xl rounded-lg overflow-hidden">
            <table class="w-full text-right">
                <thead class="bg-slate-800 text-white">
                    <tr>
                        <th class="p-4">נושא ותיאור</th>
                        <th class="p-4">סטטוס</th>
                        <th class="p-4">טכנאי מטפל</th>
                        <th class="p-4 text-center">פעולות</th>
                    </tr>
                </thead>
                <tbody id="ticketsList">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_PRIMARY } from './js/app.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();

        let allTechs = []; // רשימת טכנאים לשימוש בתפריט הבחירה

        async function init() {
            // 1. שליפת רשימת הטכנאים והמנהלים מהמערכת
            const usersSnap = await getDocs(collection(db, "users"));
            usersSnap.forEach(u => {
                const data = u.data();
                if (data.role === 'tech' || data.role === 'admin' || data.email === ADMIN_PRIMARY) {
                    allTechs.push({ email: data.email, name: data.displayName || data.email });
                }
            });

            // 2. האזנה לקריאות לפי הרשאות
            auth.onAuthStateChanged(async (user) => {
                if (!user) return;
                
                const userDoc = await getDoc(doc(db, "users", user.uid));
                const role = userDoc.data()?.role || 'user';
                const isAdmin = (user.email === ADMIN_PRIMARY || role === 'admin');
                const isTech = (role === 'tech');

                let q = query(collection(db, "tickets"), where("userId", "==", user.uid));
                if (isAdmin) q = collection(db, "tickets");
                else if (isTech) q = query(collection(db, "tickets"), where("assignedTo", "==", user.email));

                onSnapshot(q, (snapshot) => {
                    renderTickets(snapshot, user.email, isAdmin, isTech);
                });
            });
        }

        function renderTickets(snapshot, currentUserEmail, isAdmin, isTech) {
            const list = document.getElementById('ticketsList');
            list.innerHTML = '';

            snapshot.forEach(ticketDoc => {
                const t = ticketDoc.data();
                const id = ticketDoc.id;

                // יצירת אפשרויות לבחירת טכנאי
                let techOptions = `<option value="">ללא שיוך</option>`;
                allTechs.forEach(tech => {
                    techOptions += `<option value="${tech.email}" ${t.assignedTo === tech.email ? 'selected' : ''}>${tech.name}</option>`;
                });

                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="p-4">
                        <div class="font-bold">${t.title}</div>
                        <div class="text-xs text-gray-500">${t.description}</div>
                    </td>
                    <td class="p-4">
                        <select onchange="updateTicket('${id}', {status: this.value})" class="text-xs border rounded p-1">
                            <option value="חדש" ${t.status === 'חדש' ? 'selected' : ''}>חדש</option>
                            <option value="בטיפול" ${t.status === 'בטיפול' ? 'selected' : ''}>בטיפול</option>
                            <option value="הושלם" ${t.status === 'הושלם' ? 'selected' : ''}>הושלם</option>
                        </select>
                    </td>
                    <td class="p-4">
                        ${(isAdmin || (isTech && t.assignedTo === currentUserEmail)) ? `
                            <select onchange="updateTicket('${id}', {assignedTo: this.value})" class="text-xs border rounded p-1 bg-blue-50">
                                ${techOptions}
                            </select>
                        ` : `<span class="text-xs">${t.assignedTo || 'לא שויך'}</span>`}
                    </td>
                    <td class="p-4 text-center text-gray-400 text-xs">${t.userEmail}</td>
                `;
                list.appendChild(tr);
            });
        }

        // פונקציית עדכון גלובלית
        window.updateTicket = async (id, data) => {
            try {
                await updateDoc(doc(db, "tickets", id), data);
            } catch (e) { alert("שגיאה בעדכון: " + e.message); }
        };

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Raw Editor - IT MGMT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen font-mono">

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-6">
            <div>
                <h1 class="text-2xl font-bold text-blue-400"><i class="fas fa-database ml-2"></i>RAW DATABASE EDITOR</h1>
                <p class="text-slate-500 text-sm">ניהול ישיר של רשומות במסד הנתונים</p>
            </div>
            <div class="flex gap-4">
                <select id="collectionSelect" onchange="loadCollection(this.value)" class="bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500">
                    <option value="tickets">קריאות שירות (Tickets)</option>
                    <option value="clients">לקוחות (Clients)</option>
                    <option value="users">משתמשים (Users)</option>
                    <option value="licenses">רישיונות (Licenses)</option>
                </select>
            </div>
        </header>

        <div class="mb-6 flex gap-4">
            <input type="text" id="dbSearch" oninput="filterTable()" placeholder="חיפוש חופשי בנתונים..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm outline-none">
            <div class="bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 text-xs flex items-center">
                רשומות: <span id="recordCount" class="mr-2 font-bold text-blue-400">0</span>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-right text-xs border-collapse">
                    <thead id="tableHead" class="bg-slate-800 text-slate-400 uppercase tracking-wider">
                        </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth, ADMIN_PRIMARY } from './js/app.js';
        import { collection, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let currentData = [];

        // פונקציה לטעינת אוסף נבחר
        window.loadCollection = (colName) => {
            onSnapshot(collection(db, colName), (snap) => {
                currentData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTable(colName);
                document.getElementById('recordCount').innerText = currentData.length;
            });
        };

        function renderTable(colName) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            
            if (currentData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">אין נתונים באוסף זה</td></tr>';
                return;
            }

            // חילוץ כותרות מכל המפתחות שקיימים באובייקטים
            const keys = ['id', ...new Set(currentData.flatMap(obj => Object.keys(obj).filter(k => k !== 'id')))];
            
            thead.innerHTML = `<tr>${keys.map(k => `<th class="p-4 border-b border-slate-700">${k}</th>`).join('')}<th class="p-4 border-b border-slate-700">פעולות</th></tr>`;

            tbody.innerHTML = currentData.map(row => `
                <tr class="hover:bg-slate-800/50 transition-colors">
                    ${keys.map(k => `
                        <td class="p-4 text-slate-300 max-w-[200px] truncate" title="${row[k] || ''}">
                            ${k === 'id' ? `<span class="text-blue-500 font-bold">${row[k]}</span>` : (row[k] || '-')}
                        </td>
                    `).join('')}
                    <td class="p-4 flex gap-2">
                        <button onclick="deleteRecord('${colName}', '${row.id}')" class="text-rose-500 hover:text-rose-400 p-1">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        window.deleteRecord = async (col, id) => {
            if(confirm(`האם למחוק סופית את רשומה ${id}?`)) {
                await deleteDoc(doc(db, col, id));
            }
        };

        window.filterTable = () => {
            const term = document.getElementById('dbSearch').value.toLowerCase();
            const filtered = currentData.filter(row => 
                Object.values(row).some(val => String(val).toLowerCase().includes(term))
            );
            // כאן אפשר להוסיף לוגיקה לרינדור מחדש רק של הסינון
        };

        // בדיקת הרשאה ראשונית
        auth.onAuthStateChanged(user => {
            if(user && user.email === ADMIN_PRIMARY) {
                loadCollection('tickets'); // ברירת מחדל
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>

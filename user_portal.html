<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>פתיחת קריאה</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-2xl mx-auto p-6 bg-white shadow-lg rounded-lg mt-10">
        <h2 class="text-2xl font-bold mb-6 border-b pb-2">פתח קריאת שירות חדשה</h2>
        <form id="ticketForm" class="space-y-4">
            <div>
                <label class="block font-medium">נושא הקריאה</label>
                <input type="text" id="title" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block font-medium">תיאור התקלה</label>
                <textarea id="desc" required class="w-full border p-2 rounded h-32 focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">שלח קריאה</button>
        </form>
    </div>

    <script type="module">
        import { auth, db, injectNavbar } from './js/app.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        injectNavbar();

        document.getElementById('ticketForm').onsubmit = async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return alert("עליך להתחבר מחדש");

            try {
                await addDoc(collection(db, "tickets"), {
                    title: document.getElementById('title').value,
                    description: document.getElementById('desc').value,
                    status: "חדש",
                    userId: user.uid,
                    userEmail: user.email,
                    createdAt: new Date().toISOString()
                });
                alert("הקריאה נפתחה בהצלחה!");
                e.target.reset();
            } catch (err) { alert("שגיאה: " + err.message); }
        };
    </script>
</body>
</html>

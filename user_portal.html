<div class="max-w-2xl mx-auto mt-10 p-6 bg-white rounded shadow">
    <h2 class="text-xl font-bold mb-4">פתיחת קריאת שירות כללית</h2>
    <form id="ticket-form">
        <label class="block mb-2">מחלקה:</label>
        <select id="dept" class="w-full p-2 mb-4 border rounded">
            <option>לוגיסטיקה</option>
            <option>משאבי אנוש</option>
            <option>אחזקה</option>
        </select>
        <label class="block mb-2">תיאור התקלה:</label>
        <textarea id="desc" class="w-full p-2 mb-4 border rounded" rows="4"></textarea>
        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded">שלח קריאה</button>
    </form>
</div>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת IT - דף הבית</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-6">
        
        <div id="welcomeHeader" class="mb-8 p-6 bg-white rounded-xl shadow-sm border-r-8 border-blue-600">
            <h1 class="text-3xl font-bold text-gray-800">ברוך הבא למערכת הניהול</h1>
            <p class="text-gray-600 mt-2" id="userGreeting">טוען נתונים...</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="lg:col-span-2">
                <div id="licenseAlertsContainer"></div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <a href="user_portal.html" class="bg-white p-6 rounded-lg shadow hover:shadow-md transition text-center border-b-4 border-blue-500">
                        <i class="fas fa-plus-circle text-4xl text-blue-500 mb-4"></i>
                        <h3 class="text-xl font-bold">פתיחת קריאה</h3>
                        <p class="text-gray-500 text-sm mt-2">דווח על תקלה</p>
                    </a>

                    <a href="eset_licenses.html" class="bg-white p-6 rounded-lg shadow hover:shadow-md transition text-center border-b-4 border-green-500">
                        <i class="fas fa-shield-alt text-4xl text-green-500 mb-4"></i>
                        <h3 class="text-xl font-bold">ניהול רישיונות</h3>
                        <div id="licenseBadge" class="hidden mt-2 inline-block bg-red-500 text-white text-xs px-2 py-1 rounded-full">פגי תוקף!</div>
                    </a>

                    <a href="report.html" class="bg-white p-6 rounded-lg shadow hover:shadow-md transition text-center border-b-4 border-orange-500">
                        <i class="fas fa-chart-pie text-4xl text-orange-500 mb-4"></i>
                        <h3 class="text-xl font-bold">דוחות</h3>
                    </a>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h3 class="text-lg font-bold mb-4 text-center">פילוג רישיונות</h3>
                <canvas id="licenseChart"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar } from './js/app.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();

        let myChart = null; // משתנה לשמירת הגרף

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('userGreeting').innerText = `מחובר כעת: ${user.email}`;
                monitorLicenses(); 
            } else {
                window.location.href = 'login.html';
            }
        });

        function monitorLicenses() {
            onSnapshot(collection(db, "licenses"), (snapshot) => {
                let expiredList = [];
                let stats = {}; // לאיסוף נתונים לגרף
                const today = new Date();

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const category = data.category || 'אחר';
                    
                    // ספירה לגרף
                    stats[category] = (stats[category] || 0) + 1;

                    if (data.expiry && new Date(data.expiry) < today) {
                        expiredList.push(data);
                    }
                });

                // עדכון התראות (כמו קודם)
                updateAlertsUI(expiredList);
                
                // עדכון הגרף
                updateChart(stats);
            });
        }

        function updateAlertsUI(expiredList) {
            const container = document.getElementById('licenseAlertsContainer');
            const badge = document.getElementById('licenseBadge');
            if (expiredList.length > 0) {
                badge.classList.remove('hidden');
                container.innerHTML = `
                    <div class="mb-6 p-4 bg-red-50 border-r-8 border-red-500 rounded-lg">
                        <h2 class="font-bold text-red-800"><i class="fas fa-exclamation-triangle ml-2"></i>יש ${expiredList.length} רישיונות שפגו!</h2>
                    </div>`;
            } else {
                badge.classList.add('hidden');
                container.innerHTML = '';
            }
        }

        function updateChart(stats) {
            const ctx = document.getElementById('licenseChart').getContext('2d');
            
            if (myChart) myChart.destroy(); // מחיקת גרף ישן לפני עדכון

            myChart = new Chart(ctx, {
                type: 'doughnut', // גרף טבעת
                data: {
                    labels: Object.keys(stats),
                    datasets: [{
                        data: Object.values(stats),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Control | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        .sidebar { width: 260px; min-width: 260px; transition: all 0.3s; }
        .active-tab { background-color: #34494a; color: white; border-right: 4px solid #22c55e; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; right: -260px; height: 100%; z-index: 50; }
            .sidebar.active { right: 0; }
            .main-content { margin-right: 0; }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 flex min-h-screen text-gray-800 dark:text-gray-100">

    <aside id="sidebar" class="sidebar bg-[#162122] flex flex-col text-[#a5b1b2] shadow-2xl overflow-y-auto">
        <div class="p-6 text-white font-bold text-xl border-b border-gray-700 flex items-center gap-2">
            <i class="fas fa-microchip text-emerald-400"></i> IT CONTROL
        </div>
        <nav class="flex-1 mt-4 space-y-1">
            <a href="index.html" class="active-tab w-full text-right py-4 px-6 flex items-center gap-4">
                <i class="fas fa-chart-line w-5"></i> דאשבורד
            </a>
            <a href="incidents.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-ticket-alt w-5"></i> קריאות שירות
            </a>
            <a href="eset_licenses.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-shield-alt w-5"></i> רישיונות ESET
            </a>
            <a href="admin_users.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-users-cog w-5"></i> ניהול משתמשים
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <div id="user-email" class="mb-2 text-xs text-center truncate italic opacity-60"></div>
            <button onclick="logout()" class="w-full bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white transition py-2 rounded-xl font-bold flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> התנתק
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="md:hidden bg-slate-800 text-white p-4 flex justify-between items-center">
            <span class="font-bold">IT CONTROL</span>
            <button onclick="document.getElementById('sidebar').classList.toggle('active')"><i class="fas fa-bars text-xl"></i></button>
        </header>

        <main class="p-6 md:p-10 space-y-8 overflow-y-auto">
            <header>
                <h1 class="text-3xl font-black dark:text-white">לוח בקרה <span class="text-emerald-500">ראשי</span></h1>
                <p class="text-gray-500 dark:text-gray-400">ברוך הבא למערכת הניהול המרכזית</p>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-gray-200 dark:border-gray-700">
                    <h3 class="text-gray-400 text-xs font-bold uppercase">סטטוס שרתים</h3>
                    <p class="text-3xl font-black mt-2 text-emerald-500">Online</p>
                </div>
                <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-gray-200 dark:border-gray-700">
                    <h3 class="text-gray-400 text-xs font-bold uppercase">קריאות פתוחות</h3>
                    <p class="text-3xl font-black mt-2">14</p>
                </div>
                <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-gray-200 dark:border-gray-700">
                    <h3 class="text-gray-400 text-xs font-bold uppercase">רישיונות פגים</h3>
                    <p class="text-3xl font-black mt-2 text-red-500">3</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA", authDomain: "itservice-ef2cb.firebaseapp.com", projectId: "itservice-ef2cb", storageBucket: "itservice-ef2cb.firebasestorage.app", messagingSenderId: "585535831360", appId: "1:585535831360:web:8b84f53b6892a2fc490ea5" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
            else document.getElementById('user-email').innerText = user.email;
        });

        window.logout = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>

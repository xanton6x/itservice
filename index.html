<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Manager - עמוד ראשי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-800 text-white flex flex-col shadow-lg">
        <div class="p-6 text-center border-b border-slate-700">
            <h1 class="text-2xl font-bold tracking-widest text-blue-400">IT PORTAL</h1>
            <p class="text-xs text-gray-400 mt-1">מערכת ניהול אחודה</p>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <a href="index.html" class="flex items-center p-3 bg-blue-600 rounded-lg transition">
                <i class="fas fa-home ml-3"></i> דף הבית
            </a>
            <a href="user_portal.html" class="flex items-center p-3 hover:bg-slate-700 rounded-lg transition">
                <i class="fas fa-plus-circle ml-3"></i> פתיחת קריאה
            </a>
            <a href="incidents.html" class="flex items-center p-3 hover:bg-slate-700 rounded-lg transition">
                <i class="fas fa-ticket-alt ml-3"></i> הקריאות שלי
            </a>
            <a href="eset_licenses.html" class="flex items-center p-3 hover:bg-slate-700 rounded-lg transition">
                <i class="fas fa-shield-alt ml-3"></i> ניהול רישיונות ESET
            </a>
            <a href="report.html" class="flex items-center p-3 hover:bg-slate-700 rounded-lg transition">
                <i class="fas fa-chart-bar ml-3"></i> סטטיסטיקה ודוחות
            </a>
            <hr class="border-slate-700 my-4">
            <a href="admin_users.html" class="flex items-center p-3 hover:bg-slate-700 rounded-lg transition text-orange-400">
                <i class="fas fa-users-cog ml-3"></i> ניהול משתמשים
            </a>
            <a href="settings.html" class="flex items-center p-3 hover:bg-slate-700 rounded-lg transition">
                <i class="fas fa-cog ml-3"></i> הגדרות מערכת
            </a>
        </nav>

        <div class="p-4 border-t border-slate-700">
            <button id="logoutBtn" class="flex items-center w-full p-2 text-red-400 hover:bg-red-900/20 rounded-lg transition">
                <i class="fas fa-sign-out-alt ml-3"></i> התנתקות
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center px-8">
            <h2 class="text-xl font-semibold text-gray-800">שלום, <span id="userName">אורח</span></h2>
            <div class="flex items-center space-x-4 space-x-reverse">
                <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full font-bold">מערכת פעילה</span>
                <img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff" class="w-10 h-10 rounded-full border">
            </div>
        </header>

        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border-r-4 border-blue-500">
                    <h3 class="text-gray-500 text-sm">קריאות פתוחות</h3>
                    <p class="text-3xl font-bold text-gray-800" id="openTicketsCount">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-r-4 border-orange-500">
                    <h3 class="text-gray-500 text-sm">רישיונות פגי תוקף בקרוב</h3>
                    <p class="text-3xl font-bold text-gray-800" id="expiringLicensesCount">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-r-4 border-green-500">
                    <h3 class="text-gray-500 text-sm">משתמשים רשומים</h3>
                    <p class="text-3xl font-bold text-gray-800" id="totalUsersCount">0</p>
                </div>
            </div>

            <div class="bg-blue-50 border-r-4 border-blue-400 p-4 mb-8">
                <div class="flex items-center">
                    <i class="fas fa-info-circle text-blue-500 ml-3"></i>
                    <p class="text-blue-800 text-sm">עדכון אחרון: המערכת פועלת כשורה. כל הנתונים מסונכרנים מול Firebase.</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const auth = getAuth();

        // בדיקת חיבור משתמש
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                document.getElementById('userName').innerText = user.email.split('@')[0];
            }
        });

        // התנתקות
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "login.html");
        });
    </script>
</body>
</html>

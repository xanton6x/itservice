<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Management System | RCC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .sn-sidebar { background-color: #162122; color: #a5b1b2; }
        .active-tab { background-color: #34494a; color: white; border-right: 4px solid #22c55e; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 sn-sidebar flex-shrink-0 flex flex-col">
        <div class="p-6 text-white font-bold text-xl border-b border-gray-700 flex items-center gap-2">
            <i class="fas fa-microchip text-green-400"></i> IT CONTROL
        </div>
        <nav class="flex-1 mt-4 space-y-1">
            <a href="index.html" class="w-full text-right py-3 px-6 flex items-center gap-4 active-tab">
                <i class="fas fa-chart-line w-5"></i> דאשבורד
            </a>
            <a href="incidents.html" class="w-full text-right py-3 px-6 flex items-center gap-4 text-gray-400 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-ticket-alt w-5"></i> קריאות שירות
            </a>
            <a href="eset_licenses.html" class="w-full text-right py-3 px-6 flex items-center gap-4 text-gray-400 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-shield-alt w-5 text-emerald-400"></i> רישיונות ESET
            </a>
            <a href="admin_users.html" class="w-full text-right py-3 px-6 flex items-center gap-4 text-gray-400 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-users-cog w-5"></i> ניהול משתמשים
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700 text-xs">
            <div id="user-display-name" class="mb-2 text-gray-400 truncate text-center">טוען משתמש...</div>
            <button onclick="logout()" class="w-full bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white transition py-2 rounded-lg font-bold flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> התנתק מהמערכת
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <div id="mod-dashboard" class="module p-8">
            <h1 class="text-2xl font-bold mb-8 text-slate-800">שלום, <span id="welcome-user">טוען...</span></h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div onclick="window.location.href='incidents.html'" class="bg-white p-6 rounded-xl shadow-sm border-r-4 border-blue-500 cursor-pointer hover:shadow-md transition group">
                    <p class="text-gray-400 text-xs font-bold uppercase group-hover:text-blue-500 transition">סה"כ קריאות</p>
                    <h2 id="stat-total" class="text-3xl font-bold mt-2 text-slate-800">0</h2>
                    <p class="text-[10px] text-blue-500 mt-2">לחץ לצפייה בכל הקריאות ←</p>
                </div>

                <div onclick="window.location.href='incidents.html'" class="bg-white p-6 rounded-xl shadow-sm border-r-4 border-red-500 cursor-pointer hover:shadow-md transition group">
                    <p class="text-red-500 text-xs font-bold uppercase group-hover:opacity-80 transition">קריאות דחופות (P1)</p>
                    <h2 id="stat-high" class="text-3xl font-bold mt-2 text-red-600">0</h2>
                    <p class="text-[10px] text-red-500 mt-2">לחץ לטיפול דחוף ←</p>
                </div>

                <div onclick="window.location.href='eset_licenses.html'" class="bg-white p-6 rounded-xl shadow-sm border-r-4 border-emerald-500 cursor-pointer hover:shadow-md transition group">
                    <p class="text-emerald-600 text-xs font-bold uppercase group-hover:opacity-80 transition">ESET - דורש חידוש</p>
                    <h2 id="dash-eset-alerts" class="text-3xl font-bold mt-2 text-emerald-600">0</h2>
                    <p class="text-[10px] text-emerald-600 mt-2">לחץ לניהול רישיונות ←</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA",
            authDomain: "itservice-ef2cb.firebaseapp.com",
            projectId: "itservice-ef2cb",
            storageBucket: "itservice-ef2cb.firebasestorage.app",
            messagingSenderId: "585535831360",
            appId: "1:585535831360:web:8b84f53b6892a2fc490ea5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- פונקציית התנתקות גלובלית ---
        window.logout = async () => {
            if(confirm("האם להתנתק מהמערכת?")) {
                try {
                    await signOut(auth);
                    window.location.replace("login.html");
                } catch (e) {
                    alert("שגיאה בהתנתקות");
                }
            }
        };

        // --- שומר סף ובדיקת משתמש ---
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("login.html");
            } else {
                document.getElementById('user-display-name').innerText = user.email;
                document.getElementById('welcome-user').innerText = user.email.split('@')[0];
                initDashboard();
            }
        });

        // --- טעינת נתוני דאשבורד ---
        function initDashboard() {
            // האזנה לקריאות שירות
            onSnapshot(collection(db, "incidents"), (snapshot) => {
                let total = 0;
                let high = 0;
                snapshot.forEach(doc => {
                    total++;
                    if(doc.data().priority && doc.data().priority.includes('P1')) high++;
                });
                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-high').innerText = high;
            });

            // האזנה ל-ESET
            onSnapshot(collection(db, "eset_licenses"), (snapshot) => {
                let alertCount = 0;
                const now = new Date();
                snapshot.forEach(doc => {
                    const diff = Math.ceil((new Date(doc.data().expiryDate) - now) / (1000 * 60 * 60 * 24));
                    if (diff <= 30) alertCount++;
                });
                document.getElementById('dash-eset-alerts').innerText = alertCount;
            });
        }
    </script>
</body>
</html>

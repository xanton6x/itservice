<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>IT Control | Enterprise Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; background: #f8fafc; color: #1e293b; }
        .sidebar { width: 260px; background: #0f172a; min-height: 100vh; transition: all 0.3s; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: #94a3b8; transition: 0.2s; }
        .nav-link:hover { color: white; background: #1e293b; }
        .active-link { color: white; background: #334155; border-right: 4px solid #10b981; }
        .stat-card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="flex">
    <aside class="sidebar shadow-2xl">
        <div class="p-8 text-2xl font-black text-emerald-400 tracking-tighter border-b border-slate-800">IT CONTROL</div>
        <nav class="mt-6">
            <a href="index.html" class="nav-link active-link"><i class="fas fa-th-large"></i> דאשבורד</a>
            <a href="incidents.html" class="nav-link"><i class="fas fa-ticket-alt"></i> קריאות שירות</a>
            <a href="eset_licenses.html" class="nav-link"><i class="fas fa-shield-virus"></i> רישיונות ESET</a>
            <a href="reports.html" class="nav-link"><i class="fas fa-chart-line"></i> דוחות ונתונים</a>
            <a href="admin_users.html" class="nav-link"><i class="fas fa-user-shield"></i> ניהול צוות</a>
        </nav>
        <div class="absolute bottom-0 w-[260px] p-6 border-t border-slate-800">
            <button onclick="logout()" class="w-full bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white py-3 rounded-xl font-bold transition">התנתק</button>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-black text-slate-800">סקירה כללית</h1>
                <p id="today-date" class="text-slate-500 font-medium"></p>
            </div>
            <div class="flex items-center gap-4 bg-white p-2 rounded-2xl shadow-sm border">
                <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
                    <i class="fas fa-user"></i>
                </div>
                <div class="ml-4 pl-4"><p class="text-xs font-bold text-slate-400">שלום,</p><p id="user-display" class="text-sm font-bold text-slate-800 italic">מנהל מערכת</p></div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="stat-card">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-4 text-xl"><i class="fas fa-clock"></i></div>
                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest">קריאות פתוחות</h3>
                <p id="open-count" class="text-3xl font-black mt-1">0</p>
            </div>
            <div class="stat-card">
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mb-4 text-xl"><i class="fas fa-exclamation-triangle"></i></div>
                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest">דחיפות גבוהה</h3>
                <p id="high-priority-count" class="text-3xl font-black mt-1 text-red-500">0</p>
            </div>
            <div class="stat-card">
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mb-4 text-xl"><i class="fas fa-check-circle"></i></div>
                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest">נסגרו היום</h3>
                <p id="closed-today" class="text-3xl font-black mt-1 text-emerald-600">0</p>
            </div>
            <div class="stat-card">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-4 text-xl"><i class="fas fa-key"></i></div>
                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest">רישיונות פגים</h3>
                <p id="eset-expired" class="text-3xl font-black mt-1">0</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA", authDomain: "itservice-ef2cb.firebaseapp.com", projectId: "itservice-ef2cb", storageBucket: "itservice-ef2cb.firebasestorage.app", messagingSenderId: "585535831360", appId: "1:585535831360:web:8b84f53b6892a2fc490ea5" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('today-date').innerText = new Intl.DateTimeFormat('he-IL', { dateStyle: 'full' }).format(new Date());

        onAuthStateChanged(auth, user => {
            if(!user) window.location.href="login.html";
            else document.getElementById('user-display').innerText = user.email.split('@')[0];
        });

        // עדכון סטטיסטיקה בזמן אמת
        onSnapshot(collection(db, "incidents"), snap => {
            const open = snap.docs.filter(d => d.data().status !== 'סגור').length;
            const high = snap.docs.filter(d => d.data().priority === 'גבוהה' && d.data().status !== 'סגור').length;
            document.getElementById('open-count').innerText = open;
            document.getElementById('high-priority-count').innerText = high;
        });

        window.logout = () => signOut(auth).then(() => window.location.href="login.html");
    </script>
</body>
</html>

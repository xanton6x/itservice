<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Asset Management | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f4f7f9; display: flex; }
        .sn-sidebar { width: 240px; background: #293e40; min-height: 100vh; color: #bdc0c4; }
        .sn-header { background: white; border-bottom: 1px solid #d1d4d7; height: 50px; display: flex; align-items: center; padding: 0 20px; width: 100%; }
        .asset-card { background: white; border: 1px solid #d1d4d7; border-radius: 2px; }
        .status-pill { padding: 2px 8px; border-radius: 2px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .active-link { background: #4d6062; color: white; border-right: 4px solid #81b532; }
    </style>
</head>
<body class="flex">
    <aside class="sn-sidebar">
        <div class="p-5 text-xl font-bold text-white italic border-b border-white/10">service<span class="text-emerald-400">now</span></div>
        <nav class="mt-4">
            <a href="index.html" class="block p-3 hover:bg-slate-700">Dashboard</a>
            <a href="incidents.html" class="block p-3 hover:bg-slate-700">Incidents</a>
            <a href="eset_licenses.html" class="block p-3 active-link italic">Asset Management (ESET)</a>
            <a href="reports.html" class="block p-3 hover:bg-slate-700">Reports</a>
        </nav>
    </aside>

    <main class="flex-1">
        <header class="sn-header justify-between">
            <div class="text-[11px] text-slate-500 font-medium">Assets > Software Licenses > <span class="text-slate-800 font-bold">ESET Endpoint</span></div>
            <div class="text-[11px] font-bold text-slate-600">Admin: anton@rcc.co.il</div>
        </header>

        <div class="p-6">
            <div class="asset-card mb-6 p-4 bg-slate-50">
                <div class="grid grid-cols-4 gap-4">
                    <input type="text" id="cust" placeholder="Client Name" class="border p-2 text-sm outline-none focus:border-blue-500">
                    <input type="text" id="key" placeholder="License Key" class="border p-2 text-sm outline-none focus:border-blue-500">
                    <input type="date" id="exp" class="border p-2 text-sm outline-none">
                    <button onclick="addLicense()" class="bg-[#293e40] text-white text-xs font-bold uppercase hover:bg-[#3b5052]">Register Asset</button>
                </div>
            </div>

            <div class="asset-card overflow-hidden">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-100 border-b">
                        <tr>
                            <th class="p-3 text-[10px] uppercase text-slate-500">Client / Department</th>
                            <th class="p-3 text-[10px] uppercase text-slate-500">License ID</th>
                            <th class="p-3 text-[10px] uppercase text-slate-500">Expires</th>
                            <th class="p-3 text-[10px] uppercase text-slate-500">Status</th>
                            <th class="p-3"></th>
                        </tr>
                    </thead>
                    <tbody id="eset-table" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>

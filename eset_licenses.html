<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול רישיונות ESET</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-5xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">ניהול רישיונות ESET</h1>
        
        <div id="adminForm" class="hidden bg-white p-6 rounded-lg shadow-md mb-8">
            <h3 class="font-bold mb-4">הוסף רישיון חדש</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="clientName" placeholder="שם הלקוח/מחשב" class="border p-2 rounded">
                <input type="date" id="expDate" class="border p-2 rounded">
                <button id="addLicenseBtn" class="bg-green-600 text-white p-2 rounded hover:bg-green-700">שמור רישיון</button>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-right">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="p-4">שם לקוח</th>
                        <th class="p-4">תאריך תפוגה</th>
                        <th class="p-4">סטטוס</th>
                    </tr>
                </thead>
                <tbody id="licenseTableBody"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_EMAIL } from './js/app.js';
        import { collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        injectNavbar();

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('adminForm').classList.remove('hidden');
            }
        });

        // הוספת רישיון
        document.getElementById('addLicenseBtn').onclick = async () => {
            const name = document.getElementById('clientName').value;
            const date = document.getElementById('expDate').value;
            if (name && date) {
                await addDoc(collection(db, "licenses"), { clientName: name, expiryDate: date });
                alert("רישיון נוסף!");
            }
        };

        // הצגת רישיונות
        onSnapshot(collection(db, "licenses"), (snapshot) => {
            const tbody = document.getElementById('licenseTableBody');
            tbody.innerHTML = '';
            snapshot.forEach(doc => {
                const d = doc.data();
                const isExpired = new Date(d.expiryDate) < new Date();
                tbody.innerHTML += `
                    <tr class="border-b ${isExpired ? 'bg-red-50' : ''}">
                        <td class="p-4">${d.clientName}</td>
                        <td class="p-4">${d.expiryDate}</td>
                        <td class="p-4 font-bold ${isExpired ? 'text-red-600' : 'text-green-600'}">
                            ${isExpired ? 'פג תוקף' : 'תקין'}
                        </td>
                    </tr>`;
            });
        });
    </script>
</body>
</html>

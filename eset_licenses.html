<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESET License Manager PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .card-stat { transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-5px); }
        .bg-eset { background-color: #006b5d; } /* צבע ESET רשמי */
    </style>
</head>
<body class="min-h-screen">

<nav class="bg-gray-900 text-white p-4 sticky top-0 z-50 shadow-xl">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-6">
            <a href="index.html" class="text-gray-400 hover:text-emerald-400 transition flex items-center gap-2 text-sm">
                <i class="fas fa-chevron-right"></i> חזרה ל-IT Management
            </a>
            <div class="h-6 w-[1px] bg-gray-700"></div>
            <h1 class="text-xl font-extrabold tracking-tighter text-emerald-400">ESET<span class="text-white">SHIELD</span></h1>
        </div>
        
        <div class="flex items-center gap-4">
            <button onclick="importRCCData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition">
                ייבוא נתוני RCC
            </button>
            <button onclick="generatePDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition">
                ייצא דו"ח PDF
            </button>
        </div>
    </div>
</nav>

    <main class="max-w-7xl mx-auto p-6 lg:p-12">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
            <div class="card-stat bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">סה"כ רישיונות</p>
                <h2 id="stat-total" class="text-3xl font-black mt-2">0</h2>
            </div>
            <div class="card-stat bg-white p-6 rounded-2xl shadow-sm border-r-4 border-red-500">
                <p class="text-red-500 text-[10px] font-bold uppercase tracking-widest">פגו תוקף</p>
                <h2 id="stat-expired" class="text-3xl font-black mt-2 text-red-600">0</h2>
            </div>
            <div class="card-stat bg-white p-6 rounded-2xl shadow-sm border-r-4 border-orange-500">
                <p class="text-orange-500 text-[10px] font-bold uppercase tracking-widest">פגים ב-30 יום</p>
                <h2 id="stat-warning" class="text-3xl font-black mt-2 text-orange-600">0</h2>
            </div>
            <div class="card-stat bg-white p-6 rounded-2xl shadow-sm border-r-4 border-emerald-500">
                <p class="text-emerald-500 text-[10px] font-bold uppercase tracking-widest">שווי חידושים מוערך</p>
                <h2 id="stat-cost" class="text-3xl font-black mt-2 text-emerald-700">₪0</h2>
            </div>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-sm mb-12 border border-gray-100">
            <h3 class="text-lg font-bold mb-6 flex items-center gap-2"><i class="fas fa-plus-circle text-emerald-500"></i> הוספת רישיון חדש למאגר</h3>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <input type="text" id="in-name" placeholder="שם הלקוח / חברה" class="bg-gray-50 border-none p-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                <input type="text" id="in-key" placeholder="מפתח (XXXX-XXXX)" class="bg-gray-50 border-none p-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                <input type="number" id="in-price" placeholder="מחיר חידוש (₪)" class="bg-gray-50 border-none p-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                <input type="date" id="in-date" class="bg-gray-50 border-none p-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="saveToCloud()" class="bg-gray-900 text-white rounded-xl font-bold hover:bg-black transition shadow-lg">שמור ב-Cloud</button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-100">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                <span class="font-bold text-gray-700">רשימת מלאי רישיונות</span>
                <input type="text" id="tableSearch" onkeyup="searchTable()" placeholder="חיפוש חופשי..." class="text-xs p-2 rounded border outline-none w-48">
            </div>
            <table class="w-full text-right" id="licenseTable">
                <thead class="bg-gray-50 text-gray-400 text-[10px] uppercase font-bold border-b">
                    <tr>
                        <th class="p-5">לקוח</th>
                        <th class="p-5">מפתח</th>
                        <th class="p-5 text-center text-gray-800">תוקף</th>
                        <th class="p-5">ימים שנותרו</th>
                        <th class="p-5 text-center">סטטוס</th>
                        <th class="p-5">פעולות</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="text-sm divide-y divide-gray-50">
                    </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA",
            authDomain: "itservice-ef2cb.firebaseapp.com",
            projectId: "itservice-ef2cb",
            storageBucket: "itservice-ef2cb.firebasestorage.app",
            messagingSenderId: "585535831360",
            appId: "1:585535831360:web:8b84f53b6892a2fc490ea5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "eset_licenses");

        onSnapshot(query(colRef, orderBy("expiryDate", "asc")), (snapshot) => {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let stats = { total: 0, expired: 0, warning: 0, cost: 0 };
            const now = new Date();

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const id = docSnap.id;
                const expDate = new Date(data.expiryDate);
                const diffDays = Math.ceil((expDate - now) / (1000 * 60 * 60 * 24));
                
                stats.total++;
                stats.cost += Number(data.price || 0);

                let badge = "bg-emerald-100 text-emerald-700";
                let status = "תקין";
                
                if(diffDays < 0) {
                    badge = "bg-red-100 text-red-700 animate-pulse";
                    status = "פג תוקף";
                    stats.expired++;
                } else if(diffDays <= 30) {
                    badge = "bg-orange-100 text-orange-700";
                    status = "פג בקרוב";
                    stats.warning++;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition" data-status="${diffDays < 0 ? 'expired' : (diffDays <= 30 ? 'warning' : 'good')}">
                        <td class="p-5 font-bold">${data.name}</td>
                        <td class="p-5 font-mono text-xs text-gray-400">${data.key}</td>
                        <td class="p-5 text-center font-semibold text-gray-600">${data.expiryDate}</td>
                        <td class="p-5 font-black ${diffDays < 0 ? 'text-red-600' : ''}">${diffDays}</td>
                        <td class="p-5 text-center"><span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${badge}">${status}</span></td>
                        <td class="p-5 text-center">
                            <button onclick="deleteLic('${id}')" class="text-gray-300 hover:text-red-600"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('stat-total').innerText = stats.total;
            document.getElementById('stat-expired').innerText = stats.expired;
            document.getElementById('stat-warning').innerText = stats.warning;
            document.getElementById('stat-cost').innerText = '₪' + stats.cost;
        });

        window.saveToCloud = async () => {
            const name = document.getElementById('in-name').value;
            const key = document.getElementById('in-key').value;
            const price = document.getElementById('in-price').value;
            const date = document.getElementById('in-date').value;

            if(!name || !date) return alert("חובה להזין שם ותאריך תפוגה");

            await addDoc(colRef, { name, key, price, expiryDate: date, timestamp: Date.now() });
            document.querySelectorAll('input').forEach(i => i.value = '');
        };

        window.deleteLic = async (id) => {
            if(confirm("למחוק את הרישיון?")) await deleteDoc(doc(db, "eset_licenses", id));
        };

        window.filterByStatus = (status) => {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(r => r.style.display = (status === 'all' || r.dataset.status === status) ? '' : 'none');
        };

        window.searchTable = () => {
            const val = document.getElementById('tableSearch').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(r => r.style.display = r.innerText.toLowerCase().includes(val) ? '' : 'none');
        };

        window.generatePDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("ESET License Expiration Report", 14, 15);
            doc.autoTable({ html: '#licenseTable', margin: { top: 25 } });
            doc.save("eset-report.pdf");
        };

    // הוסף את זה בתוך ה-script type="module" הקיים

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESET License Manager PRO | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .sn-sidebar { background-color: #162122; color: #a5b1b2; }
        .active-tab { background-color: #34494a; color: white; border-right: 4px solid #22c55e; }
        .card-stat { transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 sn-sidebar flex-shrink-0 flex flex-col">
        <div class="p-6 text-white font-bold text-xl border-b border-gray-700 flex items-center gap-2">
            <i class="fas fa-microchip text-green-400"></i> IT CONTROL
        </div>
        <nav class="flex-1 mt-4 space-y-1">
            <a href="index.html" class="w-full text-right py-3 px-6 flex items-center gap-4 text-gray-400 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-chart-line w-5"></i> דאשבורד
            </a>
            <a href="incidents.html" class="w-full text-right py-3 px-6 flex items-center gap-4 text-gray-400 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-ticket-alt w-5"></i> קריאות שירות
            </a>
            <a href="eset_licenses.html" class="w-full text-right py-3 px-6 flex items-center gap-4 active-tab">
                <i class="fas fa-shield-alt w-5 text-emerald-400"></i> רישיונות ESET
            </a>
            <a href="admin_users.html" class="w-full text-right py-3 px-6 flex items-center gap-4 text-gray-400 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-users-cog w-5"></i> ניהול משתמשים
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700 text-xs">
            <div id="user-display-name" class="mb-2 text-gray-400 truncate text-center italic">טוען...</div>
            <button onclick="logout()" class="w-full bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white transition py-2 rounded-lg font-bold flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> התנתק
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <nav class="bg-white border-b p-4 shadow-sm flex justify-between items-center sticky top-0 z-10">
            <h2 class="text-xl font-extrabold text-emerald-600 italic">ESET<span class="text-slate-800">SHIELD</span></h2>
            <div class="flex gap-3">
                <button onclick="importRCCData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition">ייבוא RCC</button>
                <button onclick="generatePDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition">ייצא PDF</button>
            </div>
        </nav>

        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="card-stat bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">סה"כ רישיונות</p>
                    <h2 id="stat-total" class="text-3xl font-black mt-2">0</h2>
                </div>
                <div class="card-stat bg-white p-6 rounded-2xl shadow-sm border-r-4 border-red-500">
                    <p class="text-red-500 text-[10px] font-bold uppercase tracking-widest">פגו תוקף</p>
                    <h2 id="stat-expired" class="text-3xl font-black mt-2 text-red-600">0</h2>
                </div>
                <div class="card-stat bg-white p-6 rounded-2xl shadow-sm border-r-4 border-orange-500">
                    <p class="text-orange-500 text-[10px] font-bold uppercase tracking-widest">פגים ב-30 יום</p>
                    <h2 id="stat-warning" class="text-3xl font-black mt-2 text-orange-600">0</h2>
                </div>
                <div class="card-stat bg-white p-6 rounded-2xl shadow-sm border-r-4 border-emerald-500">
                    <p class="text-emerald-500 text-[10px] font-bold uppercase tracking-widest">שווי מוערך</p>
                    <h2 id="stat-cost" class="text-3xl font-black mt-2 text-emerald-700">₪0</h2>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm mb-8 border border-gray-100">
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-plus-circle text-emerald-500"></i> הוספת רישיון</h3>
                <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                    <input type="text" id="in-name" placeholder="שם לקוח" class="bg-gray-50 p-3 rounded-xl text-sm outline-none border focus:border-emerald-500">
                    <input type="text" id="in-key" placeholder="מפתח" class="bg-gray-50 p-3 rounded-xl text-sm outline-none border focus:border-emerald-500">
                    <input type="number" id="in-price" placeholder="מחיר (₪)" class="bg-gray-50 p-3 rounded-xl text-sm outline-none border focus:border-emerald-500">
                    <input type="date" id="in-date" class="bg-gray-50 p-3 rounded-xl text-sm outline-none border focus:border-emerald-500">
                    <button onclick="saveToCloud()" class="bg-slate-900 text-white rounded-xl font-bold hover:bg-black transition">שמור ענן</button>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
                <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                    <span class="font-bold text-gray-700">מאגר רישיונות פעיל</span>
                    <input type="text" id="tableSearch" onkeyup="searchTable()" placeholder="חיפוש..." class="text-xs p-2 rounded border outline-none w-48">
                </div>
                <table class="w-full text-right" id="licenseTable">
                    <thead class="bg-gray-50 text-gray-400 text-[10px] uppercase font-bold border-b">
                        <tr>
                            <th class="p-4">לקוח</th>
                            <th class="p-4">מפתח</th>
                            <th class="p-4 text-center">תוקף</th>
                            <th class="p-4">ימים</th>
                            <th class="p-4 text-center">סטטוס</th>
                            <th class="p-4">פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA",
            authDomain: "itservice-ef2cb.firebaseapp.com",
            projectId: "itservice-ef2cb",
            storageBucket: "itservice-ef2cb.firebasestorage.app",
            messagingSenderId: "585535831360",
            appId: "1:585535831360:web:8b84f53b6892a2fc490ea5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const colRef = collection(db, "eset_licenses");

        // --- אבטחה וניתוק ---
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace("login.html");
            else document.getElementById('user-display-name').innerText = user.email;
        });

        window.logout = async () => {
            if(confirm("האם להתנתק?")) {
                await signOut(auth);
                window.location.replace("login.html");
            }
        };

        // --- ניהול רישיונות ---
        onSnapshot(query(colRef, orderBy("expiryDate", "asc")), (snapshot) => {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let stats = { total: 0, expired: 0, warning: 0, cost: 0 };
            const now = new Date();

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const expDate = new Date(data.expiryDate);
                const diffDays = Math.ceil((expDate - now) / (1000 * 60 * 60 * 24));
                
                stats.total++;
                stats.cost += Number(data.price || 0);

                let badge = "bg-emerald-100 text-emerald-700";
                let status = "תקין";
                if(diffDays < 0) {
                    badge = "bg-red-100 text-red-700 animate-pulse";
                    status = "פג תוקף";
                    stats.expired++;
                } else if(diffDays <= 30) {
                    badge = "bg-orange-100 text-orange-700";
                    status = "פג בקרוב";
                    stats.warning++;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition border-b">
                        <td class="p-4 font-bold">${data.name}</td>
                        <td class="p-4 font-mono text-xs text-gray-400">${data.key || '---'}</td>
                        <td class="p-4 text-center text-gray-600">${data.expiryDate}</td>
                        <td class="p-4 font-black ${diffDays < 0 ? 'text-red-600' : ''}">${diffDays}</td>
                        <td class="p-4 text-center"><span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${badge}">${status}</span></td>
                        <td class="p-4 text-center">
                            <button onclick="deleteLic('${docSnap.id}')" class="text-gray-300 hover:text-red-600"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>`;
            });

            document.getElementById('stat-total').innerText = stats.total;
            document.getElementById('stat-expired').innerText = stats.expired;
            document.getElementById('stat-warning').innerText = stats.warning;
            document.getElementById('stat-cost').innerText = '₪' + stats.cost;
        });

        window.saveToCloud = async () => {
            const name = document.getElementById('in-name').value;
            const key = document.getElementById('in-key').value;
            const price = document.getElementById('in-price').value;
            const date = document.getElementById('in-date').value;
            if(!name || !date) return alert("שם ותאריך חובה!");
            await addDoc(colRef, { name, key, price, expiryDate: date, timestamp: Date.now() });
            document.querySelectorAll('input').forEach(i => i.value = '');
        };

        window.deleteLic = async (id) => {
            if(confirm("למחוק?")) await deleteDoc(doc(db, "eset_licenses", id));
        };

        window.searchTable = () => {
            const val = document.getElementById('tableSearch').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(r => r.style.display = r.innerText.toLowerCase().includes(val) ? '' : 'none');
        };

        window.generatePDF = () => {
            const { jsPDF } = window.jspdf;
            const docPdf = new jsPDF();
            docPdf.text("ESET Expiration Report", 14, 15);
            docPdf.autoTable({ html: '#licenseTable', margin: { top: 25 } });
            docPdf.save("eset-report.pdf");
        };

        window.importRCCData = async () => {
            const fullList = [
                { n: "RCC - NFR", d: "2026-10-06", k: "3BA-3DM-G9W" },
                { n: "GARAGE MOZNA", d: "2026-06-22", k: "333-DBJ-9UW" },
                { n: "Kognit", d: "2026-05-26", k: "3AH-97S-DGE" },
                { n: "Levi Yona Acc", d: "2026-04-25", k: "3AC-MC7-RKE" }
            ];
            if(!confirm("לייבא נתונים?")) return;
            for (const item of fullList) {
                await addDoc(colRef, { name: item.n, expiryDate: item.d, key: item.k, timestamp: Date.now() });
            }
            alert("הייבוא הושלם!");
        };
    </script>
</body>
</html>

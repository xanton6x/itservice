<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>IT Service - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
        <h1 class="text-2xl font-bold mb-6 text-blue-600">מערכת IT מרכזית</h1>
        <div id="auth-form">
            <input type="email" id="email" placeholder="אימייל" class="w-full p-2 mb-4 border rounded">
            <input type="password" id="password" placeholder="סיסמה" class="w-full p-2 mb-4 border rounded">
            <button id="login-btn" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition">התחבר</button>
            <p class="mt-4 text-sm cursor-pointer text-gray-500" id="toggle-auth">אין לך חשבון? הירשם כאן</p>
        </div>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>

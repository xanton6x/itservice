<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Login | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Assistant', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="login-box text-center">
        <h1 class="text-2xl font-black mb-6 italic text-slate-800">IT CONTROL</h1>
        <form id="loginForm" class="space-y-4">
            <input type="email" id="email" placeholder="אימייל" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
            <input type="password" id="password" placeholder="סיסמה" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
            <button type="submit" id="loginBtn" class="w-full bg-slate-800 text-white p-3 rounded-xl font-bold hover:bg-slate-900 transition">התחבר</button>
        </form>
        <div id="errorMsg" class="mt-4 text-red-500 text-sm font-bold hidden"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA", authDomain: "itservice-ef2cb.firebaseapp.com", projectId: "itservice-ef2cb", storageBucket: "itservice-ef2cb.firebasestorage.app", messagingSenderId: "585535831360", appId: "1:585535831360:web:8b84f53b6892a2fc490ea5" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault(); // עוצר את ריענון הדף!
            const btn = document.getElementById('loginBtn');
            btn.innerText = "מתחבר...";
            
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                window.location.href = "index.html";
            } catch (err) {
                const errDiv = document.getElementById('errorMsg');
                errDiv.innerText = "פרטי התחברות שגויים";
                errDiv.classList.remove('hidden');
                btn.innerText = "התחבר";
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #0d1314; color: white; }
        .login-card { background-color: #1a2526; border-radius: 2.5rem; border: 1px solid #2d3a3b; }
        .input-field { background-color: #243435; border: 1px solid #3d4f50; color: white; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="login-card max-w-md w-full p-10 shadow-2xl">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-500 rounded-3xl mb-6 shadow-lg shadow-emerald-500/20">
                <i class="fas fa-microchip text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-black italic">IT CONTROL</h1>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="text-xs font-bold text-slate-400 mr-2 uppercase tracking-widest">אימייל</label>
                <input type="email" id="email" required class="input-field w-full px-5 py-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-400 mr-2 uppercase tracking-widest">סיסמה</label>
                <input type="password" id="password" required class="input-field w-full px-5 py-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-emerald-600/20">
                התחבר למערכת
            </button>
        </form>
        <div id="errorMsg" class="hidden mt-6 p-4 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-2xl text-center font-bold italic"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA", 
            authDomain: "itservice-ef2cb.firebaseapp.com", 
            projectId: "itservice-ef2cb", 
            storageBucket: "itservice-ef2cb.firebasestorage.app", 
            messagingSenderId: "585535831360", 
            appId: "1:585535831360:web:8b84f53b6892a2fc490ea5" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // אם המשתמש כבר מחובר - תעביר אותו
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User already logged in:", user.email);
                window.location.replace("index.html");
            }
        });

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerText = "מעבד...";
            errorMsg.classList.add('hidden');

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log("Logged in successfully!");
                window.location.replace("index.html");
            } catch (error) {
                console.error("Login Error Details:", error.code, error.message);
                errorMsg.classList.remove('hidden');
                errorMsg.innerText = "שגיאה: " + error.code;
                
                // התראה קופצת כדי שנוכל לראות את השגיאה גם בנייד
                alert("שגיאת התחברות: " + error.code);
                
                loginBtn.disabled = false;
                loginBtn.innerText = "התחבר למערכת";
            }
        };
    </script>
</body>
</html>

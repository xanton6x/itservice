<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { 
            font-family: 'Assistant', sans-serif; 
            background-color: #f1f5f9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
        }
        .login-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 400px; 
        }
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }
        .input-field:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        .btn-primary {
            background-color: #1e293b;
            color: white;
            width: 100%;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: bold;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }
        .btn-primary:hover {
            background-color: #334155;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500 rounded-2xl mb-4 shadow-lg shadow-emerald-500/20">
                <i class="fas fa-microchip text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 italic">IT CONTROL</h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">מערכת ניהול תשתיות</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1 mr-1">אימייל</label>
                <input type="email" id="email" required class="input-field" placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1 mr-1">סיסמה</label>
                <input type="password" id="password" required class="input-field" placeholder="••••••••">
            </div>
            <button type="submit" id="loginBtn" class="btn-primary">התחבר למערכת</button>
        </form>

        <div id="errorMsg" class="hidden mt-6 p-3 bg-red-50 text-red-500 text-xs rounded-xl text-center font-bold border border-red-100 italic"></div>
        
        <p class="mt-8 text-center text-slate-400 text-[10px] font-bold uppercase tracking-tighter opacity-60">RCC IT SOLUTIONS &copy; 2026</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA", 
            authDomain: "itservice-ef2cb.firebaseapp.com", 
            projectId: "itservice-ef2cb", 
            storageBucket: "itservice-ef2cb.firebasestorage.app", 
            messagingSenderId: "585535831360", 
            appId: "1:585535831360:web:8b84f53b6892a2fc490ea5" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // בדיקה אם כבר מחובר
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.replace("index.html");
        });

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        loginForm.onsubmit = async (e) => {
            e.preventDefault(); // *** מונע את הריענון שגרם לתקלה ***
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerText = "מתחבר...";
            errorMsg.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.replace("index.html");
            } catch (error) {
                errorMsg.classList.remove('hidden');
                
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                    errorMsg.innerText = "אימייל או סיסמה לא נכונים";
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg.innerText = "ניסיונות רבים מדי. נסה שוב מאוחר יותר";
                } else {
                    errorMsg.innerText = "שגיאה: " + error.code;
                }
                
                loginBtn.disabled = false;
                loginBtn.innerText = "התחבר למערכת";
            }
        };
    </script>
</body>
</html>

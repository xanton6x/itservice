<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        .login-card { background-color: white; border-radius: 2.5rem; }
        @media (prefers-color-scheme: dark) {
            body { background-color: #0d1314; }
            .login-card { background-color: #1a2526; border: 1px solid #2d3a3b; color: white; }
            .input-field { background-color: #243435; border: 1px solid #3d4f50; color: white; }
        }
        @media (prefers-color-scheme: light) {
            body { background-color: #f1f5f9; }
            .input-field { background-color: #f8fafc; border: 1px solid #e2e8f0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 transition-all">

    <div class="login-card max-w-md w-full p-12 shadow-2xl">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-500 rounded-3xl shadow-lg shadow-emerald-500/30 mb-6 rotate-3">
                <i class="fas fa-microchip text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-black tracking-tighter">IT CONTROL</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 font-bold italic">מערכת ניהול תשתיות מרכזית</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-slate-400 mr-2">אימייל</label>
                <input type="email" id="email" required class="input-field w-full px-5 py-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-sm" placeholder="your@email.com">
            </div>
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-slate-400 mr-2">סיסמה</label>
                <input type="password" id="password" required class="input-field w-full px-5 py-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-sm" placeholder="••••••••">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-emerald-600/20 transition-all transform hover:-translate-y-1">
                התחבר למערכת
            </button>
        </form>

        <div id="errorMsg" class="hidden mt-6 p-4 bg-red-500/10 border border-red-500/20 text-red-500 text-xs rounded-2xl text-center font-bold italic"></div>

        <p class="mt-10 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest opacity-50">RCC IT SOLUTIONS &copy; 2026</p>
    </div>

    </body>
</html>

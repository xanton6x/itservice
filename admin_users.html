<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול משתמשים מתקדם - IT System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">ניהול משתמשים</h1>
                <p class="text-slate-500 mt-1">ניהול הרשאות, תפקידים ובקרת גישה למערכת</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-white shadow-sm border p-3 rounded-lg text-center min-w-[100px]">
                    <span class="block text-2xl font-bold text-blue-600" id="countTotal">0</span>
                    <span class="text-xs text-slate-400 uppercase">סה"כ</span>
                </div>
                <div class="bg-white shadow-sm border p-3 rounded-lg text-center min-w-[100px]">
                    <span class="block text-2xl font-bold text-orange-500" id="countAdmins">0</span>
                    <span class="text-xs text-slate-400 uppercase">מנהלים</span>
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-t-xl border-x border-t flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-72">
                <i class="fas fa-search absolute right-3 top-3 text-slate-400"></i>
                <input type="text" id="userSearch" placeholder="חיפוש לפי אימייל או שם..." 
                       class="w-full pr-10 pl-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div class="flex gap-2">
                <button onclick="exportUsers()" class="text-sm text-slate-600 hover:text-blue-600 px-3 py-2">
                    <i class="fas fa-file-export ml-1"></i> ייצוא
                </button>
            </div>
        </div>

        <div class="bg-white rounded-b-xl shadow-xl border overflow-hidden">
            <table class="w-full text-right">
                <thead>
                    <tr class="bg-slate-800 text-white text-sm">
                        <th class="p-4 font-semibold">משתמש</th>
                        <th class="p-4 font-semibold">תפקיד</th>
                        <th class="p-4 font-semibold">תאריך הצטרפות</th>
                        <th class="p-4 font-semibold text-center">פעולות</th>
                    </tr>
                </thead>
                <tbody id="userTableBody" class="divide-y divide-slate-100">
                    </tbody>
            </table>
            <div id="loadingState" class="p-20 text-center">
                <i class="fas fa-circle-notch fa-spin text-4xl text-blue-500"></i>
                <p class="mt-4 text-slate-500">מרענן רשימת משתמשים...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_EMAIL } from './js/app.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();

        // בדיקת הרשאות מנהל
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== ADMIN_EMAIL) {
                window.location.href = 'index.html';
            }
        });

        const tableBody = document.getElementById('userTableBody');
        const loading = document.getElementById('loadingState');

        // האזנה דינמית למשתמשים
        const q = query(collection(db, "users"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            loading.classList.add('hidden');
            tableBody.innerHTML = '';
            
            let admins = 0;
            snapshot.forEach(userDoc => {
                const user = userDoc.data();
                const id = userDoc.id;
                if(user.role === 'admin') admins++;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="p-4">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 ml-3">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <div class="font-bold text-slate-800">${user.displayName || 'משתמש ללא שם'}</div>
                                <div class="text-xs text-slate-400">${user.email}</div>
                            </div>
                        </div>
                    </td>
                    <td class="p-4">
                        <select onchange="updateRole('${id}', this.value)" 
                                class="text-xs font-bold border rounded-md p-1 outline-none ${user.role === 'admin' ? 'bg-orange-50 text-orange-600 border-orange-200' : 'bg-blue-50 text-blue-600 border-blue-200'}">
                            <option value="user" ${user.role !== 'admin' ? 'selected' : ''}>משתמש קצה</option>
                            <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>מנהל מערכת</option>
                        </select>
                    </td>
                    <td class="p-4 text-sm text-slate-500 italic">
                        ${user.createdAt ? new Date(user.createdAt).toLocaleDateString('he-IL') : '---'}
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="deleteUser('${id}', '${user.email}')" class="text-slate-300 hover:text-red-500 transition">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            // עדכון מונים
            document.getElementById('countTotal').innerText = snapshot.size;
            document.getElementById('countAdmins').innerText = admins;
        });

        // פונקציות גלובליות
        window.updateRole = async (uid, newRole) => {
            try {
                await updateDoc(doc(db, "users", uid), { role: newRole });
                // חיווי הצלחה קטן (אופציונלי)
            } catch (e) { alert("שגיאה בעדכון: " + e.message); }
        };

        window.deleteUser = async (uid, email) => {
            if (email === ADMIN_EMAIL) return alert("לא ניתן למחוק את מנהל המערכת הראשי!");
            if (confirm(`האם אתה בטוח שברצונך להסיר את המשתמש ${email} מהמערכת?`)) {
                try {
                    await deleteDoc(doc(db, "users", uid));
                } catch (e) { alert("שגיאה במחיקה: " + e.message); }
            }
        };

        // חיפוש בטבלה
        document.getElementById('userSearch').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const rows = tableBody.querySelectorAll('tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        });
    </script>
</body>
</html>

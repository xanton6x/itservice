<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משתמשים | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #f3f4f6; }
        .sn-sidebar { background-color: #162122; color: #a5b1b2; }
        .active-tab { background-color: #34494a; color: white; border-right: 4px solid #22c55e; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 sn-sidebar flex-shrink-0 flex flex-col">
        <div class="p-6 text-white font-bold text-xl border-b border-gray-700 flex items-center gap-2">
            <i class="fas fa-microchip text-green-400"></i> IT CONTROL
        </div>
        <nav class="flex-1 mt-4 space-y-1">
            <a href="index.html" class="w-full text-right py-3 px-6 flex items-center gap-4 text-gray-400 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-chart-line w-5"></i> דאשבורד
            </a>
            <a href="incidents.html" class="w-full text-right py-3 px-6 flex items-center gap-4 text-gray-400 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-ticket-alt w-5"></i> קריאות שירות
            </a>
            <a href="eset_licenses.html" class="w-full text-right py-3 px-6 flex items-center gap-4 text-gray-400 hover:bg-[#34494a] hover:text-white transition">
                <i class="fas fa-shield-alt w-5 text-emerald-400"></i> רישיונות ESET
            </a>
            <a href="admin_users.html" class="w-full text-right py-3 px-6 flex items-center gap-4 active-tab">
                <i class="fas fa-users-cog w-5"></i> ניהול משתמשים
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700 text-xs">
            <div id="user-display-name" class="mb-2 text-gray-400 truncate text-center italic">טוען...</div>
            <button onclick="logout()" class="w-full bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white transition py-2 rounded-lg font-bold flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> התנתק
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <nav class="bg-white border-b p-4 shadow-sm flex justify-between items-center sticky top-0 z-10">
            <h2 class="text-xl font-bold text-slate-800">מרכז ניהול הרשאות משתמשים</h2>
        </nav>

        <div class="p-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm mb-8 border border-gray-200">
                <h2 class="text-lg font-bold mb-4 text-gray-700">הוספת משתמש חדש</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="email" id="new-user-email" placeholder="אימייל" class="border p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="new-user-pass" placeholder="סיסמה" class="border p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <select id="new-user-role" class="border p-3 rounded-xl text-sm outline-none">
                        <option value="user">User (צפייה)</option>
                        <option value="admin">Admin (ניהול)</option>
                    </select>
                    <button id="createBtn" onclick="createUser()" class="bg-slate-900 text-white font-bold rounded-xl hover:bg-black transition py-3">
                        <i class="fas fa-user-plus ml-2"></i> צור משתמש
                    </button>
                </div>
                <div id="msg" class="hidden mt-4 p-3 rounded-lg text-center text-sm font-bold"></div>
            </div>

            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
                <table class="w-full text-right text-sm">
                    <thead class="bg-gray-50 border-b font-bold text-gray-600">
                        <tr>
                            <th class="p-5">אימייל</th>
                            <th class="p-5">הרשאה</th>
                            <th class="p-5">תאריך יצירה</th>
                            <th class="p-5 text-center">פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="divide-y divide-gray-100 italic">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA",
            authDomain: "itservice-ef2cb.firebaseapp.com",
            projectId: "itservice-ef2cb",
            storageBucket: "itservice-ef2cb.firebasestorage.app",
            messagingSenderId: "585535831360",
            appId: "1:585535831360:web:8b84f53b6892a2fc490ea5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const usersCol = collection(db, "users");

        // אבטחה וניתוק
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace("login.html");
            else document.getElementById('user-display-name').innerText = user.email;
        });

        window.logout = async () => {
            if(confirm("להתנתק מהמערכת?")) {
                await signOut(auth);
                window.location.replace("login.html");
            }
        };

        const showMsg = (text, isError = false) => {
            const el = document.getElementById('msg');
            el.innerText = text;
            el.className = `mt-4 p-3 rounded-lg text-center text-sm font-bold ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        };

        window.createUser = async () => {
            const email = document.getElementById('new-user-email').value;
            const pass = document.getElementById('new-user-pass').value;
            const role = document.getElementById('new-user-role').value;
            const btn = document.getElementById('createBtn');

            if (!email || !pass) return showMsg("נא למלא אימייל וסיסמה", true);
            btn.disabled = true;

            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                await addDoc(usersCol, { email, role, timestamp: Date.now() });
                showMsg("משתמש נוסף בהצלחה!");
                document.getElementById('new-user-email').value = '';
                document.getElementById('new-user-pass').value = '';
            } catch (e) {
                showMsg("שגיאה: " + e.message, true);
            } finally {
                btn.disabled = false;
            }
        };

        window.updateRole = async (id, newRole) => {
            try {
                await updateDoc(doc(db, "users", id), { role: newRole });
                showMsg("הרשאה עודכנה");
            } catch (e) { showMsg("שגיאה בעדכון", true); }
        };

        window.resetPass = async (email) => {
            try {
                await sendPasswordResetEmail(auth, email);
                alert("אימייל איפוס נשלח ל-" + email);
            } catch (e) { alert("שגיאה: " + e.message); }
        };

        window.deleteUserDoc = async (id) => {
            if(confirm("למחוק מהרשימה? (מומלץ למחוק גם מה-Firebase Console)")) {
                await deleteDoc(doc(db, "users", id));
            }
        };

        onSnapshot(usersCol, (snapshot) => {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            snapshot.forEach(userDoc => {
                const u = userDoc.data();
                const id = userDoc.id;
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition border-b">
                        <td class="p-5 font-bold text-slate-700">${u.email}</td>
                        <td class="p-5">
                            <select onchange="updateRole('${id}', this.value)" class="bg-white border rounded-lg px-2 py-1 text-xs">
                                <option value="user" ${u.role === 'user' ? 'selected' : ''}>User</option>
                                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                        </td>
                        <td class="p-5 text-gray-400 text-xs">${new Date(u.timestamp).toLocaleDateString()}</td>
                        <td class="p-5 flex justify-center gap-4">
                            <button onclick="resetPass('${u.email}')" class="text-blue-500 hover:underline text-xs font-bold">איפוס סיסמה</button>
                            <button onclick="deleteUserDoc('${id}')" class="text-gray-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>`;
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול משתמשים - IT System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-6">
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h1 class="text-2xl font-bold mb-4 text-gray-800 border-b pb-4">ניהול הרשאות משתמשים</h1>
            
            <div id="userList" class="overflow-x-auto">
                <p class="text-center text-gray-500 italic p-4">טוען רשימת משתמשים...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_EMAIL } from './js/app.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // הזרקת התפריט
        injectNavbar();

        // בדיקה שאכן מדובר במנהל
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== ADMIN_EMAIL) {
                alert("גישה חסומה: דף זה מיועד למנהל המערכת בלבד.");
                window.location.href = 'index.html';
            }
        });

        const listDiv = document.getElementById('userList');

        // משיכת נתונים מ-Firestore
        onSnapshot(collection(db, "users"), (snapshot) => {
            if (snapshot.empty) {
                listDiv.innerHTML = '<p class="text-center p-4">לא נמצאו משתמשים במסד הנתונים.</p>';
                return;
            }

            let html = `
                <table class="w-full text-right mt-4 border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700">
                            <th class="p-3 border">שם מלא</th>
                            <th class="p-3 border">אימייל</th>
                            <th class="p-3 border">תפקיד</th>
                            <th class="p-3 border text-center">פעולות</th>
                        </tr>
                    </thead>
                    <tbody>`;
            
            snapshot.forEach(userDoc => {
                const user = userDoc.data();
                const userId = userDoc.id;
                html += `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="p-3 border">${user.displayName || 'משתמש חדש'}</td>
                        <td class="p-3 border">${user.email}</td>
                        <td class="p-3 border">
                            <span class="px-2 py-1 rounded-full text-xs font-bold ${user.role === 'admin' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}">
                                ${user.role || 'user'}
                            </span>
                        </td>
                        <td class="p-3 border text-center">
                            <button onclick="toggleAdmin('${userId}', '${user.role}')" class="text-xs bg-slate-800 text-white px-2 py-1 rounded hover:bg-slate-700 transition">
                                שנה תפקיד
                            </button>
                        </td>
                    </tr>`;
            });
            
            html += `</tbody></table>`;
            listDiv.innerHTML = html;
        });

        // פונקציה לשינוי תפקיד (Role)
        window.toggleAdmin = async (id, currentRole) => {
            const newRole = currentRole === 'admin' ? 'user' : 'admin';
            if (confirm(`האם לשנות את תפקיד המשתמש ל-${newRole}?`)) {
                try {
                    await updateDoc(doc(db, "users", id), { role: newRole });
                } catch (e) {
                    alert("שגיאה בעדכון: " + e.message);
                }
            }
        };
    </script>
</body>
</html>

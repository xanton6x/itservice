<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול משתמשים | IT System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-slate-900 text-white p-4 shadow-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-xl text-blue-400"><i class="fas fa-users-cog"></i> User Management Center</h1>
            <a href="index.html" class="text-sm bg-gray-700 px-4 py-2 rounded hover:bg-gray-600">חזרה לדאשבורד</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-8">
        <div class="bg-white p-6 rounded-xl shadow-sm mb-8 border border-gray-200">
            <h2 class="text-lg font-bold mb-4">הוספת משתמש חדש למערכת</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="email" id="new-user-email" placeholder="אימייל" class="border p-3 rounded-lg text-sm">
                <input type="password" id="new-user-pass" placeholder="סיסמה ראשונית" class="border p-3 rounded-lg text-sm">
                <select id="new-user-role" class="border p-3 rounded-lg text-sm">
                    <option value="user">User (צפייה בלבד)</option>
                    <option value="admin">Admin (ניהול מלא)</option>
                </select>
                <button onclick="createUser()" class="bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">צור משתמש</button>
            </div>
            <p class="text-[10px] text-gray-400 mt-2">* יצירת משתמש תרשום אותו ב-Firebase Auth ותוסיף אותו למאגר ההרשאות.</p>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
            <table class="w-full text-right text-sm">
                <thead class="bg-gray-50 border-b font-bold text-gray-600">
                    <tr>
                        <th class="p-4">שם/אימייל</th>
                        <th class="p-4">תפקיד</th>
                        <th class="p-4">תאריך הצטרפות</th>
                        <th class="p-4">פעולות</th>
                    </tr>
                </thead>
                <tbody id="user-table-body" class="divide-y divide-gray-100">
                    </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA",
            authDomain: "itservice-ef2cb.firebaseapp.com",
            projectId: "itservice-ef2cb",
            storageBucket: "itservice-ef2cb.firebasestorage.app",
            messagingSenderId: "585535831360",
            appId: "1:585535831360:web:8b84f53b6892a2fc490ea5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const usersCol = collection(db, "users");

        // Load Users
        onSnapshot(usersCol, (snapshot) => {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            snapshot.forEach(userDoc => {
                const u = userDoc.data();
                const id = userDoc.id;
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-4 font-semibold">${u.email}</td>
                        <td class="p-4">
                            <select onchange="updateRole('${id}', this.value)" class="bg-transparent border border-gray-200 rounded px-2 py-1">
                                <option value="user" ${u.role === 'user' ? 'selected' : ''}>User</option>
                                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                        </td>
                        <td class="p-4 text-gray-400 text-xs">${new Date(u.timestamp).toLocaleDateString()}</td>
                        <td class="p-4 flex gap-3">
                            <button onclick="resetPass('${u.email}')" class="text-blue-500 hover:underline text-xs">אפס סיסמה</button>
                            <button onclick="deleteUser('${id}')" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        });

        // Create User
        window.createUser = async () => {
            const email = document.getElementById('new-user-email').value;
            const pass = document.getElementById('new-user-pass').value;
            const role = document.getElementById('new-user-role').value;

            try {
                // 1. Create in Firebase Auth
                await createUserWithEmailAndPassword(auth, email, pass);
                // 2. Create in Firestore with role
                await addDoc(usersCol, { email, role, timestamp: Date.now() });
                alert("משתמש נוצר בהצלחה!");
                document.querySelectorAll('input').forEach(i => i.value = '');
            } catch (e) { alert("שגיאה: " + e.message); }
        };

        window.updateRole = async (id, newRole) => {
            await updateDoc(doc(db, "users", id), { role: newRole });
        };

        window.resetPass = async (email) => {
            await sendPasswordResetEmail(auth, email);
            alert("אימייל לאיפוס סיסמה נשלח ל-" + email);
        };

        window.deleteUser = async (id) => {
            if(confirm("האם למחוק משתמש זה? (זה ימחק אותו מהמאגר, אך יש למחוק ידנית מה-Auth ב-Console)")) {
                await deleteDoc(doc(db, "users", id));
            }
        };
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const auth = getAuth(app);
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html"; // אם לא מחובר, זרוק אותו ללוגין
    }
});
        
    </script>
</body>
</html>

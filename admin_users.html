<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        .sidebar { width: 260px; min-width: 260px; transition: all 0.3s; }
        @media (max-width: 768px) { .sidebar { position: fixed; right: -260px; z-index: 50; } .sidebar.active { right: 0; } }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 flex min-h-screen text-gray-800 dark:text-gray-100">

    <aside id="sidebar" class="sidebar bg-[#162122] flex flex-col text-[#a5b1b2] shadow-2xl">
        <div class="p-6 text-white font-bold text-xl border-b border-gray-700 flex items-center gap-2"><i class="fas fa-microchip text-emerald-400"></i> IT CONTROL</div>
        <nav class="flex-1 mt-4 space-y-1">
            <a href="index.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#34494a] transition"><i class="fas fa-chart-line w-5"></i> דאשבורד</a>
            <a href="incidents.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#34494a] transition"><i class="fas fa-ticket-alt w-5"></i> קריאות שירות</a>
            <a href="eset_licenses.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#34494a] transition"><i class="fas fa-shield-alt w-5"></i> רישיונות ESET</a>
            <a href="admin_users.html" class="bg-[#34494a] text-white border-right-4 border-green-500 w-full text-right py-4 px-6 flex items-center gap-4 transition"><i class="fas fa-users-cog w-5 text-emerald-400"></i> ניהול משתמשים</a>
        </nav>
        <div class="p-4"><button onclick="logout()" class="w-full bg-red-500/10 text-red-400 py-2 rounded-xl font-bold flex items-center justify-center gap-2"><i class="fas fa-sign-out-alt"></i> התנתק</button></div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <main class="p-6 md:p-10 space-y-8 overflow-y-auto">
            <h1 class="text-3xl font-black">ניהול <span class="text-blue-500">משתמשים והרשאות</span></h1>

            <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-gray-200 dark:border-gray-700">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="email" id="new-user-email" placeholder="אימייל" class="bg-gray-50 dark:bg-slate-700 p-3 rounded-xl outline-none border focus:border-blue-500">
                    <input type="password" id="new-user-pass" placeholder="סיסמה" class="bg-gray-50 dark:bg-slate-700 p-3 rounded-xl outline-none border focus:border-blue-500">
                    <select id="new-user-role" class="bg-gray-50 dark:bg-slate-700 p-3 rounded-xl outline-none border">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                    <button id="createBtn" onclick="createUser()" class="bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700">צור משתמש</button>
                </div>
                <div id="msg" class="hidden mt-4 p-3 rounded-xl text-center text-xs font-bold"></div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl overflow-hidden border border-gray-200 dark:border-gray-700">
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-gray-50 dark:bg-slate-700 text-gray-500 font-bold uppercase">
                            <tr>
                                <th class="p-4">אימייל</th>
                                <th class="p-4">הרשאה</th>
                                <th class="p-4">תאריך</th>
                                <th class="p-4 text-center">פעולות</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body" class="divide-y divide-gray-100 dark:divide-gray-700 italic"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCkmi_WVVGk6PvIGoh8FEzXOyzzDN2jJqA", authDomain: "itservice-ef2cb.firebaseapp.com", projectId: "itservice-ef2cb", storageBucket: "itservice-ef2cb.firebasestorage.app", messagingSenderId: "585535831360", appId: "1:585535831360:web:8b84f53b6892a2fc490ea5" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const usersCol = collection(db, "users");

        onAuthStateChanged(auth, (user) => { if (!user) window.location.href = "login.html"; });

        const showMsg = (txt, err = false) => {
            const el = document.getElementById('msg'); el.innerText = txt;
            el.className = `mt-4 p-3 rounded-xl text-center text-xs font-bold ${err ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), 5000);
        };

        window.createUser = async () => {
            const email = document.getElementById('new-user-email').value;
            const pass = document.getElementById('new-user-pass').value;
            const role = document.getElementById('new-user-role').value;
            if(!email || !pass) return showMsg("חסרים פרטים", true);
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                await addDoc(usersCol, { email, role, timestamp: Date.now() });
                showMsg("נוצר בהצלחה");
                document.getElementById('new-user-email').value = ''; document.getElementById('new-user-pass').value = '';
            } catch(e) { showMsg(e.message, true); }
        };

        window.updateRole = async (id, role) => { await updateDoc(doc(db, "users", id), { role }); showMsg("עודכן"); };
        window.resetPass = async (email) => { await sendPasswordResetEmail(auth, email); alert("נשלח אימייל איפוס"); };
        window.deleteUserDoc = async (id) => { if(confirm("למחוק?")) await deleteDoc(doc(db, "users", id)); };

        onSnapshot(usersCol, (snap) => {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            snap.forEach(uDoc => {
                const u = uDoc.data(); const id = uDoc.id;
                tbody.innerHTML += `<tr class="border-b dark:border-slate-700">
                    <td class="p-4 font-bold text-slate-700 dark:text-gray-200">${u.email}</td>
                    <td class="p-4"><select onchange="updateRole('${id}', this.value)" class="bg-transparent border rounded p-1 text-xs">
                        <option value="user" ${u.role==='user'?'selected':''}>User</option>
                        <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
                    </select></td>
                    <td class="p-4 text-xs opacity-50">${new Date(u.timestamp).toLocaleDateString()}</td>
                    <td class="p-4 flex gap-3 justify-center">
                        <button onclick="resetPass('${u.email}')" class="text-blue-500 text-xs font-bold">איפוס</button>
                        <button onclick="deleteUserDoc('${id}')" class="text-gray-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>`;
            });
        });

        window.logout = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>

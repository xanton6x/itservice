<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | IT Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; transition: 0.3s; }
        .sidebar { width: 260px; min-width: 260px; background-color: #162122; flex-shrink: 0; }
        .active-tab { background-color: #243435; color: white; border-right: 4px solid #22c55e; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; right: -260px; height: 100%; z-index: 100; transition: 0.3s; }
            .sidebar.active { right: 0; }
        }
    </style>
</head>
<body class="bg-[#f8fafc] dark:bg-[#0d1314] flex min-h-screen text-slate-800 dark:text-slate-100">

    <aside id="sidebar" class="sidebar flex flex-col text-slate-400 shadow-2xl">
        <div class="p-6 text-white font-bold text-xl border-b border-gray-800 flex items-center gap-2">
            <i class="fas fa-microchip text-emerald-400"></i> IT CONTROL
        </div>
        <nav class="flex-1 mt-4 space-y-1">
            <a href="index.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#243435] transition">
                <i class="fas fa-chart-line w-5"></i> דאשבורד
            </a>
            <a href="incidents.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#243435] transition">
                <i class="fas fa-ticket-alt w-5"></i> קריאות שירות
            </a>
            <a href="eset_licenses.html" class="w-full text-right py-4 px-6 flex items-center gap-4 hover:bg-[#243435] transition">
                <i class="fas fa-shield-alt w-5"></i> רישיונות ESET
            </a>
            <a href="admin_users.html" class="active-tab w-full text-right py-4 px-6 flex items-center gap-4 transition">
                <i class="fas fa-users-cog w-5"></i> ניהול משתמשים
            </a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <button onclick="logout()" class="w-full bg-red-500/10 text-red-400 py-2 rounded-xl font-bold flex items-center justify-center gap-2 text-sm"><i class="fas fa-sign-out-alt"></i> התנתק</button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="md:hidden bg-[#162122] text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-[110]">
            <span class="font-bold text-emerald-400 italic">IT CONTROL</span>
            <button onclick="document.getElementById('sidebar').classList.toggle('active')"><i class="fas fa-bars text-xl"></i></button>
        </header>

        <main class="p-6 md:p-10 space-y-8 overflow-y-auto">
            <header>
                <h1 class="text-3xl font-black">ניהול <span class="text-blue-500">משתמשים והרשאות</span></h1>
                <p class="text-slate-500 dark:text-slate-400">ניהול גישה למערכת ושינוי תפקידי צוות.</p>
            </header>

            <div class="bg-white dark:bg-[#1a2526] p-8 rounded-[2rem] shadow-sm border border-slate-100 dark:border-slate-800">
                <h3 class="text-sm font-bold mb-6 text-slate-400 uppercase tracking-widest">יצירת משתמש חדש</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="email" id="new-user-email" placeholder="אימייל" class="bg-slate-50 dark:bg-[#243435] p-3 rounded-2xl border dark:border-[#3d4f50] outline-none text-sm focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="new-user-pass" placeholder="סיסמה" class="bg-slate-50 dark:bg-[#243435] p-3 rounded-2xl border dark:border-[#3d4f50] outline-none text-sm focus:ring-2 focus:ring-blue-500">
                    <select id="new-user-role" class="bg-slate-50 dark:bg-[#243435] p-3 rounded-2xl border dark:border-[#3d4f50] outline-none text-sm cursor-pointer">
                        <option value="user">User (צפייה)</option>
                        <option value="admin">Admin (ניהול)</option>
                    </select>
                    <button id="createBtn" onclick="createUser()" class="bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 transition shadow-lg shadow-blue-600/20">צור משתמש</button>
                </div>
                <div id="msg" class="hidden mt-4 p-3 rounded-xl text-center text-xs font-bold"></div>
            </div>

            <div class="bg-white dark:bg-[#1a2526] rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-50 dark:bg-[#243435] text-slate-400 font-bold italic">
                            <tr>
                                <th class="p-6">אימייל</th>
                                <th class="p-6">תפקיד</th>
                                <th class="p-6">תאריך יצירה</th>
                                <th class="p-6 text-center">פעולות</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body" class="divide-y dark:divide-slate-800 italic text-slate-600 dark:text-slate-300">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    </body>
</html>

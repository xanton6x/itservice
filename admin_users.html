<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול משתמשים - IT System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">

    <div class="max-w-6xl mx-auto p-6">
        <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">ניהול הרשאות ומשתמשים</h1>
                <div id="stats" class="text-sm font-medium text-slate-500"></div>
            </div>
            
            <div id="userList" class="min-h-[200px] relative">
                <div id="loader" class="flex flex-col items-center justify-center p-10">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
                    <p class="mt-4 text-gray-500 italic">מושך נתונים מ-Firestore...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_PRIMARY } from './js/app.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // הזרקת התפריט
        injectNavbar();

        const listDiv = document.getElementById('userList');
        const loader = document.getElementById('loader');

        onAuthStateChanged(auth, (user) => {
            if (!user) return;

            // התחלת האזנה לנתונים
            const q = query(collection(db, "users"), orderBy("email", "asc"));
            
            const unsubscribe = onSnapshot(q, (snapshot) => {
                loader.classList.add('hidden'); // הסתרת הטעינה ברגע שיש תשובה (גם אם ריקה)
                
                if (snapshot.empty) {
                    listDiv.innerHTML = '<p class="text-center p-10 text-gray-500">לא נמצאו משתמשים רשומים.</p>';
                    return;
                }

                renderTable(snapshot);
            }, (error) => {
                console.error("Firestore Error:", error);
                listDiv.innerHTML = `
                    <div class="bg-red-50 text-red-700 p-4 rounded-lg text-center">
                        <i class="fas fa-exclamation-triangle ml-2"></i>
                        שגיאת הרשאות: וודא שחוקי ה-Firestore מאפשרים קריאה.
                    </div>`;
            });
        });

        function renderTable(snapshot) {
            let html = `
                <table class="w-full text-right mt-4 border-collapse overflow-hidden rounded-lg">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700">
                            <th class="p-3 border">שם</th>
                            <th class="p-3 border">אימייל</th>
                            <th class="p-3 border">תפקיד</th>
                            <th class="p-3 border text-center">פעולה</th>
                        </tr>
                    </thead>
                    <tbody>`;
            
            snapshot.forEach(userDoc => {
                const user = userDoc.data();
                const id = userDoc.id;
                const isPrimary = (user.email === ADMIN_PRIMARY);

                html += `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="p-3 border font-medium">${user.displayName || '---'}</td>
                        <td class="p-3 border text-slate-600">${user.email}</td>
                        <td class="p-3 border">
                            <span class="px-2 py-1 rounded text-xs font-bold ${user.role === 'admin' ? 'bg-orange-100 text-orange-700' : (user.role === 'tech' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700')}">
                                ${user.role || 'user'}
                            </span>
                        </td>
                        <td class="p-3 border text-center">
                            ${isPrimary ? '<span class="text-xs text-slate-400 italic">ניהול על</span>' : `
                                <select onchange="changeRole('${id}', this.value)" class="text-xs border rounded p-1 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="user" ${user.role === 'user' ? 'selected' : ''}>משתמש</option>
                                    <option value="tech" ${user.role === 'tech' ? 'selected' : ''}>טכנאי</option>
                                    <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>מנהל</option>
                                </select>
                            `}
                        </td>
                    </tr>`;
            });
            
            html += `</tbody></table>`;
            listDiv.innerHTML = html;
            document.getElementById('stats').innerText = `סה"כ משתמשים: ${snapshot.size}`;
        }

        // פונקציית עדכון
        window.changeRole = async (id, newRole) => {
            try {
                await updateDoc(doc(db, "users", id), { role: newRole });
            } catch (e) {
                alert("שגיאה בעדכון התפקיד. וודא שאתה מחובר כמנהל.");
            }
        };
    </script>
</body>
</html>

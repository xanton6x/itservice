<main class="flex-1 bg-[#f4f7f9]">
    <div class="p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-light text-slate-700">Organization Users</h1>
            <button onclick="openModal()" class="bg-[#81b532] text-white px-4 py-2 text-xs font-bold uppercase shadow-sm">New User</button>
        </div>

        <div class="bg-white border border-slate-300 rounded-sm overflow-hidden">
            <table class="w-full text-right text-sm">
                <thead class="bg-[#f0f3f3] border-b text-slate-600">
                    <tr>
                        <th class="p-4 font-semibold">User Email</th>
                        <th class="p-4 font-semibold">System Role</th>
                        <th class="p-4 font-semibold">Account Status</th>
                        <th class="p-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-table-body" class="divide-y divide-slate-100">
                    </tbody>
            </table>
        </div>
    </div>
</main>

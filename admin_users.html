<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משתמשים - מערכת IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
            text-align: center; border-radius: 8px; padding: 16px; position: fixed;
            z-index: 100; left: 30px; bottom: 30px; font-size: 14px;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="toast">הפעולה בוצעה בהצלחה</div>

    <div class="max-w-6xl mx-auto p-6">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">ניהול משתמשים והרשאות</h1>
                <p class="text-gray-500 text-sm">ניהול גישה, תפקידים וסיסמאות למערכת ה-IT</p>
            </div>
            <button onclick="openAddUserModal()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg flex items-center gap-2">
                <i class="fas fa-user-plus"></i>
                משתמש חדש
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right">
                    <thead class="bg-slate-50 border-b border-gray-200">
                        <tr>
                            <th class="p-4 text-sm font-bold text-slate-600">שם משתמש</th>
                            <th class="p-4 text-sm font-bold text-slate-600">אימייל</th>
                            <th class="p-4 text-sm font-bold text-slate-600">תפקיד / הרשאה</th>
                            <th class="p-4 text-sm font-bold text-slate-600">פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="divide-y divide-gray-100">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="addUserModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 transition-all">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800">הוספת משתמש חדש</h2>
                <button onclick="closeAddUserModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">שם מלא</label>
                    <input type="text" id="newUserName" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">כתובת אימייל</label>
                    <input type="email" id="newUserEmail" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">תפקיד במערכת</label>
                    <select id="newUserRole" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 cursor-pointer">
                        <option value="user">משתמש כללי (פתיחת קריאות)</option>
                        <option value="tech">טכנאי (טיפול בקריאות)</option>
                        <option value="admin">מנהל מערכת (גישה מלאה)</option>
                    </select>
                </div>
                
                <div class="bg-blue-50 p-3 rounded-lg flex gap-3 items-start mt-4">
                    <i class="fas fa-info-circle text-blue-500 mt-0.5"></i>
                    <p class="text-[11px] text-blue-700 leading-relaxed">עם יצירת המשתמש, יישלח אליו אימייל אוטומטי המזמין אותו לקבוע סיסמה ראשונית ולהתחבר למערכת.</p>
                </div>

                <div class="flex gap-3 pt-4">
                    <button onclick="createNewUser()" id="saveBtn" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md">צור משתמש</button>
                    <button onclick="closeAddUserModal()" class="flex-1 bg-gray-100 text-gray-600 py-3 rounded-xl font-bold hover:bg-gray-200 transition">ביטול</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, injectNavbar, ADMIN_PRIMARY } from './js/app.js';
        import { collection, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        injectNavbar();

        // הגנה על הדף - רק מנהל ראשי נכנס
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            if (user.email !== ADMIN_PRIMARY) {
                alert("אין לך הרשאות ניהול לדף זה");
                window.location.href = 'index.html';
                return;
            }
            loadUsers();
        });

        function loadUsers() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';
                
                snapshot.forEach(uDoc => {
                    const u = uDoc.data();
                    const isSystemAdmin = u.email === ADMIN_PRIMARY;
                    
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50/50 transition">
                            <td class="p-4">
                                <div class="font-bold text-slate-800">${u.name || 'משתמש חדש'}</div>
                            </td>
                            <td class="p-4 text-sm text-slate-500">${u.email}</td>
                            <td class="p-4">
                                <select onchange="updateUserRole('${u.email}', this.value)" 
                                    ${isSystemAdmin ? 'disabled' : ''} 
                                    class="text-xs font-bold p-1.5 border rounded-lg bg-white outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer ${isSystemAdmin ? 'opacity-50' : ''}">
                                    <option value="user" ${u.role === 'user' ? 'selected' : ''}>משתמש כללי</option>
                                    <option value="tech" ${u.role === 'tech' ? 'selected' : ''}>טכנאי</option>
                                    <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>מנהל אתר</option>
                                </select>
                            </td>
                            <td class="p-4">
                                <div class="flex gap-1">
                                    <button onclick="resetUserPassword('${u.email}')" title="איפוס סיסמה" class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition">
                                        <i class="fas fa-key"></i>
                                    </button>
                                    ${!isSystemAdmin ? `
                                        <button onclick="deleteUserAccount('${u.email}')" title="מחיקת משתמש" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        // שינוי תפקיד בלייב
        window.updateUserRole = async (email, newRole) => {
            try {
                await updateDoc(doc(db, "users", email), { role: newRole });
                showToast("ההרשאה עודכנה בהצלחה");
            } catch (e) { alert("שגיאה בעדכון: " + e.message); }
        };

        window.openAddUserModal = () => { document.getElementById('addUserModal').classList.remove('hidden'); };
        window.closeAddUserModal = () => { document.getElementById('addUserModal').classList.add('hidden'); };

        window.createNewUser = async () => {
            const name = document.getElementById('newUserName').value.trim();
            const email = document.getElementById('newUserEmail').value.toLowerCase().trim();
            const role = document.getElementById('newUserRole').value;
            const btn = document.getElementById('saveBtn');

            if (!email || !name) return alert("נא למלא שם ואימייל");

            btn.disabled = true; btn.innerText = "יוצר משתמש...";

            try {
                // שמירה ב-DB
                await setDoc(doc(db, "users", email), {
                    name, email, role, createdAt: new Date().toISOString()
                });

                // שליחת אימייל להגדרת סיסמה
                await sendPasswordResetEmail(auth, email);
                
                showToast("משתמש נוצר ואימייל נשלח!");
                closeAddUserModal();
            } catch (e) { alert(e.message); }
            finally { btn.disabled = false; btn.innerText = "צור משתמש"; }
        };

        window.resetUserPassword = async (email) => {
            if (confirm(`לשלח אימייל לאיפוס סיסמה ל-${email}?`)) {
                try {
                    await sendPasswordResetEmail(auth, email);
                    showToast("אימייל איפוס נשלח");
                } catch (e) { alert(e.message); }
            }
        };

        window.deleteUserAccount = async (email) => {
            if (confirm(`למחוק את ${email} מהמערכת? פעולה זו אינה הפיכה.`)) {
                try {
                    await deleteDoc(doc(db, "users", email));
                    showToast("משתמש נמחק");
                } catch (e) { alert(e.message); }
            }
        };

        function showToast(msg) {
            const x = document.getElementById("toast");
            x.innerText = msg; x.className = "show";
            setTimeout(() => { x.className = ""; }, 3000);
        }
    </script>
</body>
</html>

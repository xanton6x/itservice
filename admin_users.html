<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול משתמשים</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <script type="module">
        import { auth, db, injectNavbar, ADMIN_EMAIL } from './js/app.js';
        import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectNavbar();

        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== ADMIN_EMAIL) {
                alert("גישה למנהלים בלבד!");
                window.location.href = 'index.html';
            }
        });

        // כאן תוכל להוסיף טבלה שמושכת נתונים מאוסף "users" במידה ויצרת כזה בעת ההרשמה
        const main = document.createElement('div');
        main.className = "max-w-4xl mx-auto mt-10 p-6 bg-white shadow rounded";
        main.innerHTML = `<h2 class="text-xl font-bold mb-4">ניהול הרשאות ומשתמשים</h2>
                         <p class="text-gray-600">המנהל הנוכחי: <b>${ADMIN_EMAIL}</b></p>
                         <hr class="my-4">
                         <div id="userList">רשימת משתמשים תיטען כאן...</div>`;
        document.body.appendChild(main);
    </script>
</body>
</html>

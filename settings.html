<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

    <title>הגדרות מערכת</title>

            <div>
                <label class="block text-sm font-medium text-gray-700">אימייל למשלוח התראות מנהל</label>

            </div>

            <button class="w-full bg-slate-800 text-white py-2 rounded-md hover:bg-slate-700 transition">שמור שינויים</button>
